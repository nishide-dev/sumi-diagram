# A DiT block with adaLN-Zero (Peebles & Xie 2023, figure 3), drawn with the
# structured layout: a stretched stack of blocks with residual connections
# through operators and junctions, and one conditioning MLP feeding four
# blocks over a shared bus with taps labeled in label math ($\gamma_1$ …).
# Tones in the color theme. The junctions are hidden (#101): the residuals
# leave the main line along rounded turns without a dot, as in the paper,
# and the output arrow ends in open space at the hidden junction `out`.
version: 1
figure:
  id: dit-block
  theme: color
  profile: paper-single
  layout:
    arrange:
      stack: { items: [block] }

groups:
  - id: block
    label: DiT Block with adaLN-Zero
    arrange:
      row:
        gap: 6mm
        align: end
        items:
          - stack:
              direction: up
              gap: 3mm
              align: stretch
              items:
                [tokens, split0, ln1, ss1, attn, scale1, add1, split1, ln2, ss2, ff, scale2, add2, out]
          - stack: { direction: up, gap: 6mm, items: [conditioning, mlp] }

nodes:
  - { id: tokens, component: box, label: Input Tokens, tone: gray }
  - { id: split0, component: junction, variant: hidden }
  - { id: ln1, component: box, label: Layer Norm, tone: yellow }
  - { id: ss1, component: box, label: "Scale, Shift", tone: blue }
  - { id: attn, component: box, label: "Multi-Head\nSelf-Attention", tone: orange }
  - { id: scale1, component: box, label: Scale, tone: blue }
  - { id: add1, component: operator, props: { symbol: plus } }
  - { id: split1, component: junction, variant: hidden }
  - { id: ln2, component: box, label: Layer Norm, tone: yellow }
  - { id: ss2, component: box, label: "Scale, Shift", tone: blue }
  - { id: ff, component: box, label: "Pointwise\nFeedforward", tone: green }
  - { id: scale2, component: box, label: Scale, tone: blue }
  - { id: add2, component: operator, props: { symbol: plus } }
  - { id: out, component: junction, variant: hidden }
  - { id: conditioning, component: box, label: Conditioning, tone: purple }
  - { id: mlp, component: box, label: MLP, tone: purple }

edges:
  - { from: tokens, to: split0, component: line }
  - { from: split0, to: ln1 }
  - { from: split0, to: add1, toAnchor: west } # residual
  - { from: ln1, to: ss1, component: line }
  - { from: ss1, to: attn, component: line }
  - { from: attn, to: scale1, component: line }
  - { from: scale1, to: add1 }
  - { from: add1, to: split1, component: line }
  - { from: split1, to: ln2 }
  - { from: split1, to: add2, toAnchor: west } # residual
  - { from: ln2, to: ss2, component: line }
  - { from: ss2, to: ff, component: line }
  - { from: ff, to: scale2, component: line }
  - { from: scale2, to: add2 }
  - { from: add2, to: out }
  - { from: conditioning, to: mlp, component: line }
  # one source port, four taps: one shared bus
  - { from: mlp, fromAnchor: north, to: ss1, toAnchor: east, label: '$\gamma_1,\beta_1$' }
  - { from: mlp, fromAnchor: north, to: scale1, toAnchor: east, label: $\alpha_1$ }
  - { from: mlp, fromAnchor: north, to: ss2, toAnchor: east, label: '$\gamma_2,\beta_2$' }
  - { from: mlp, fromAnchor: north, to: scale2, toAnchor: east, label: $\alpha_2$ }
