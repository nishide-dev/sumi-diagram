# #183 fixture: a copy of research/167-stage-c/figures/b-dit.sumi.yaml with
# `figure.fit: scale` added (nothing else changed), so the figure prints at
# the 180mm width of paper-double. Not regenerated from the research copy.
# #167 figure B: DiT (Peebles & Xie 2023, arXiv 2212.09748v2, Fig. 3), all
# four panels, drawn with today's syntax (main after v0.5.2) and compared with
# the published figure (docs/research/167-stage-c.md §1). Only generic block
# names are reused. Panels 3 and 4 are dimmed in the original: today that
# takes `variant: muted` on every node, edge and the group (no inheritance).
version: 1
figure:
  id: stage-c-dit
  theme: color
  profile: paper-double
  fit: scale
  layout:
    arrange:
      row:
        gap: 3.3mm # 3, 3.5 or 4mm trigger the operator loop (repro/operator-loop)
        align: stretch # panels of equal height, as in the original
        items:
          - stack:
              gap: 2mm
              items:
                - stack:
                    direction: up
                    gap: 2.5mm
                    align: stretch
                    items:
                      - row:
                          gap: 2mm
                          align: start
                          items:
                            - stack: { gap: 2.5mm, items: [ patchify, noised ] }
                            - stack: { gap: 2.5mm, items: [ embed, { stack: { gap: 1mm, items: [ timestep, class-label ] } } ] }
                      - dit-block
                      - layer-norm
                      - linear
                      - row: { gap: 2mm, items: [ noise, sigma ] }
                - ldt-caption
          - adaln
          - cross
          - incontext

groups:
  - id: adaln
    caption: DiT Block with adaLN-Zero
    tone: gray
    arrange:
      row:
        gap: 3mm
        align: end
        items:
          - stack:
              direction: up
              gap: 2.5mm
              align: stretch
              items: [ a-tokens, a-split0, a-ln1, a-ss1, a-attn, a-scale1, a-add1, a-split1, a-ln2, a-ss2, a-ff, a-scale2, a-add2, a-out ]
          - stack: { direction: up, gap: 4mm, items: [ a-cond, a-mlp ] }
  - id: cross
    caption: DiT Block with Cross-Attention
    variant: muted
    arrange:
      row:
        gap: 3mm
        align: end
        items:
          - stack:
              direction: up
              gap: 2.5mm
              align: stretch
              items: [ c-tokens, c-split0, c-ln1, c-attn, c-add1, c-split1, c-ln2, c-xattn, c-add2, c-split2, c-ln3, c-ff, c-add3, c-out ]
          - c-cond
  - id: incontext
    caption: DiT Block with In-Context Conditioning
    variant: muted
    arrange:
      row:
        gap: 3mm
        align: end
        items:
          - stack:
              direction: up
              gap: 2.5mm
              align: stretch
              items: [ i-tokens, i-concat, i-split0, i-ln1, i-attn, i-add1, i-split1, i-ln2, i-ff, i-add2, i-out ]
          - i-cond

nodes:
  # panel 1: latent diffusion transformer (lines without arrowheads, as in the original)
  - { id: noised, component: box, label: "Noised\nLatent\n32 × 32 × 4", tone: gray }
  - { id: patchify, component: box, label: Patchify, tone: gray }
  - { id: embed, component: box, label: Embed, tone: blue }
  - { id: timestep, component: box, label: Timestep $t$, tone: blue }
  - { id: class-label, component: box, label: Label $y$, tone: blue }
  - { id: dit-block, component: box, label: DiT Block, props: { height: 34pt } }
  - { id: dit-n, component: label, label: N x, attach: { to: dit-block, side: west, gap: 1.5mm } }
  - { id: layer-norm, component: box, label: Layer Norm, tone: blue }
  - { id: linear, component: box, label: Linear and Reshape, tone: green }
  - { id: noise, component: box, label: "Noise\n32 × 32 × 4", tone: gray }
  - { id: sigma, component: box, label: "$\\Sigma$\n32 × 32 × 4", tone: gray }
  - { id: ldt-caption, component: label, label: Latent Diffusion Transformer }
  # panel 2: adaLN-Zero
  - { id: a-tokens, component: box, label: Input Tokens, tone: gray }
  - { id: a-split0, component: junction, variant: hidden }
  - { id: a-ln1, component: box, label: Layer Norm, tone: blue }
  - { id: a-ss1, component: box, label: "Scale, Shift", tone: blue }
  - { id: a-attn, component: box, label: "Multi-Head\nSelf-Attention", tone: orange }
  - { id: a-scale1, component: box, label: Scale, tone: blue }
  - { id: a-add1, component: operator, props: { symbol: plus } }
  - { id: a-split1, component: junction, variant: hidden }
  - { id: a-ln2, component: box, label: Layer Norm, tone: blue }
  - { id: a-ss2, component: box, label: "Scale, Shift", tone: blue }
  - { id: a-ff, component: box, label: "Pointwise\nFeedforward", tone: green }
  - { id: a-scale2, component: box, label: Scale, tone: blue }
  - { id: a-add2, component: operator, props: { symbol: plus } }
  - { id: a-out, component: junction, variant: hidden }
  - { id: a-cond, component: box, label: Conditioning, tone: blue }
  - { id: a-mlp, component: box, label: MLP, tone: blue }
  # panel 3: cross-attention (dimmed)
  - { id: c-tokens, component: box, label: Input Tokens, tone: gray, variant: muted }
  - { id: c-split0, component: junction, variant: hidden }
  - { id: c-ln1, component: box, label: Layer Norm, tone: blue, variant: muted }
  - { id: c-attn, component: box, label: "Multi-Head\nSelf-Attention", tone: orange, variant: muted }
  - { id: c-add1, component: operator, props: { symbol: plus }, variant: muted }
  - { id: c-split1, component: junction, variant: hidden }
  - { id: c-ln2, component: box, label: Layer Norm, tone: blue, variant: muted }
  - { id: c-xattn, component: box, label: "Multi-Head\nCross-Attention", tone: red, variant: muted }
  - { id: c-add2, component: operator, props: { symbol: plus }, variant: muted }
  - { id: c-split2, component: junction, variant: hidden }
  - { id: c-ln3, component: box, label: Layer Norm, tone: blue, variant: muted }
  - { id: c-ff, component: box, label: "Pointwise\nFeedforward", tone: green, variant: muted }
  - { id: c-add3, component: operator, props: { symbol: plus }, variant: muted }
  - { id: c-out, component: junction, variant: hidden }
  - { id: c-cond, component: box, label: Conditioning, tone: blue, variant: muted }
  # panel 4: in-context conditioning (dimmed)
  - { id: i-tokens, component: box, label: Input Tokens, tone: gray, variant: muted }
  - { id: i-cond, component: box, label: Conditioning, tone: blue, variant: muted }
  - { id: i-concat, component: box, label: "Concatenate\non Sequence\nDimension", tone: blue, variant: muted }
  - { id: i-split0, component: junction, variant: hidden }
  - { id: i-ln1, component: box, label: Layer Norm, tone: blue, variant: muted }
  - { id: i-attn, component: box, label: "Multi-Head\nSelf-Attention", tone: orange, variant: muted }
  - { id: i-add1, component: operator, props: { symbol: plus }, variant: muted }
  - { id: i-split1, component: junction, variant: hidden }
  - { id: i-ln2, component: box, label: Layer Norm, tone: blue, variant: muted }
  - { id: i-ff, component: box, label: "Pointwise\nFeedforward", tone: green, variant: muted }
  - { id: i-add2, component: operator, props: { symbol: plus }, variant: muted }
  - { id: i-out, component: junction, variant: hidden }

edges:
  # panel 1
  - { from: noised, to: patchify, component: line }
  - { from: patchify, to: dit-block, component: line }
  - { from: timestep, to: embed, component: line }
  - { from: embed, to: dit-block, component: line }
  - { from: dit-block, to: layer-norm, component: line }
  - { from: layer-norm, to: linear, component: line }
  - { from: linear, to: noise }
  - { from: linear, to: sigma }
  # zoom callout today: two dashed lines from the block's right corners to the
  # panel's left corners (orthogonal, not the diagonals of the original)
  - { from: dit-block, fromAnchor: "east:0", to: adaln, toAnchor: "west:0", component: line, variant: dashed }
  - { from: dit-block, fromAnchor: "east:1", to: adaln, toAnchor: "west:1", component: line, variant: dashed }
  # panel 2
  - { from: a-tokens, to: a-split0, component: line }
  - { from: a-split0, to: a-ln1, component: line }
  - { from: a-split0, to: a-add1, toAnchor: west }
  - { from: a-ln1, to: a-ss1, component: line }
  - { from: a-ss1, to: a-attn, component: line }
  - { from: a-attn, to: a-scale1, component: line }
  - { from: a-scale1, to: a-add1, component: line }
  - { from: a-add1, to: a-split1, component: line }
  - { from: a-split1, to: a-ln2, component: line }
  - { from: a-split1, to: a-add2, toAnchor: west }
  - { from: a-ln2, to: a-ss2, component: line }
  - { from: a-ss2, to: a-ff, component: line }
  - { from: a-ff, to: a-scale2, component: line }
  - { from: a-scale2, to: a-add2, component: line }
  - { from: a-add2, to: a-out }
  - { from: a-cond, to: a-mlp, component: line }
  - { from: a-mlp, fromAnchor: north, to: a-ss1, toAnchor: east, label: '$\gamma_1,\beta_1$' }
  - { from: a-mlp, fromAnchor: north, to: a-scale1, toAnchor: east, label: $\alpha_1$ }
  - { from: a-mlp, fromAnchor: north, to: a-ss2, toAnchor: east, label: '$\gamma_2,\beta_2$' }
  - { from: a-mlp, fromAnchor: north, to: a-scale2, toAnchor: east, label: $\alpha_2$ }
  # panel 3 (dimmed: muted lines)
  - { from: c-tokens, to: c-split0, component: line, variant: muted }
  - { from: c-split0, to: c-ln1, component: line, variant: muted }
  - { from: c-split0, to: c-add1, toAnchor: west, variant: muted }
  - { from: c-ln1, to: c-attn, component: line, variant: muted }
  - { from: c-attn, to: c-add1, component: line, variant: muted }
  - { from: c-add1, to: c-split1, component: line, variant: muted }
  - { from: c-split1, to: c-ln2, component: line, variant: muted }
  - { from: c-split1, to: c-add2, toAnchor: west, variant: muted }
  - { from: c-ln2, to: c-xattn, component: line, variant: muted }
  - { from: c-cond, fromAnchor: north, to: c-xattn, toAnchor: east, variant: muted }
  - { from: c-xattn, to: c-add2, component: line, variant: muted }
  - { from: c-add2, to: c-split2, component: line, variant: muted }
  - { from: c-split2, to: c-ln3, component: line, variant: muted }
  - { from: c-split2, to: c-add3, toAnchor: west, variant: muted }
  - { from: c-ln3, to: c-ff, component: line, variant: muted }
  - { from: c-ff, to: c-add3, component: line, variant: muted }
  - { from: c-add3, to: c-out, variant: muted }
  # panel 4 (dimmed): the conditioning enters the concatenation from the side
  - { from: i-tokens, to: i-concat, component: line, variant: muted }
  - { from: i-cond, fromAnchor: north, to: i-concat, toAnchor: east, variant: muted }
  - { from: i-concat, to: i-split0, component: line, variant: muted }
  - { from: i-split0, to: i-ln1, component: line, variant: muted }
  - { from: i-split0, to: i-add1, toAnchor: west, variant: muted }
  - { from: i-ln1, to: i-attn, component: line, variant: muted }
  - { from: i-attn, to: i-add1, component: line, variant: muted }
  - { from: i-add1, to: i-split1, component: line, variant: muted }
  - { from: i-split1, to: i-ln2, component: line, variant: muted }
  - { from: i-split1, to: i-add2, toAnchor: west, variant: muted }
  - { from: i-ln2, to: i-ff, component: line, variant: muted }
  - { from: i-ff, to: i-add2, component: line, variant: muted }
  - { from: i-add2, to: i-out, variant: muted }
