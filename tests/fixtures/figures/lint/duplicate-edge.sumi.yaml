version: 1
figure:
  id: duplicate-edge
nodes:
  - id: a
    component: box
    label: A
  - id: b
    component: box
    label: B
edges:
  # Duplicate of "first": the variant does not matter.
  - id: first
    from: a
    to: b
  - from: a
    to: b
    variant: dashed
  # Not duplicates: the opposite direction, another label.
  - from: b
    to: a
  - from: a
    to: b
    label: different
  # Lines have no direction, so b–a duplicates a–b.
  - from: a
    to: b
    component: line
  - from: b
    to: a
    component: line
