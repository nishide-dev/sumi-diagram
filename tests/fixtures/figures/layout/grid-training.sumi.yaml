version: 1
figure:
  id: training-pipeline
  theme: color
  profile: paper-double
  layout:
    arrange:
      grid:
        columns: 4
        rowGap: 10mm
        columnGap: 6mm
        align: center
        items:
          - dataset
          - sample
          - augment
          - augmented
          - model
          - loss
          - item: optimizer
            span: 2
nodes:
  - id: dataset
    component: cylinder
    label: |-
      ImageNet-1k
      1.28M images
  - id: sample
    component: image
    variant: framed
    props:
      src: grid-assets/sample.png
      height: 34pt
  - id: sample-cap
    component: label
    label: input $x$
    attach:
      to: sample
      side: south
      gap: 1mm
  - id: augment
    component: box
    label: |-
      RandAugment
      + Mixup
    tone: yellow
  - id: augment-icon
    component: label
    icon: tabler/arrows-shuffle
    attach:
      to: augment
      side: north
      gap: 1mm
  - id: augmented
    component: image
    variant: framed
    props:
      src: grid-assets/augmented.png
      height: 34pt
  - id: augmented-cap
    component: label
    label: augmented $x'$
    attach:
      to: augmented
      side: north
      gap: 1mm
  - id: model
    component: box
    label: ViT-B/16
    variant: emphasis
  - id: model-icon
    component: label
    icon: tabler/brain
    attach:
      to: model
      side: west
      gap: 1mm
  - id: loss
    component: box
    label: |-
      Cross-entropy
      loss
    tone: red
  - id: optimizer
    component: box
    label: AdamW
    tone: green
  - id: curve
    component: image
    variant: framed
    props:
      src: grid-assets/loss-curve.svg
      height: 28pt
    attach:
      to: loss
      side: south
      gap: 4mm
edges:
  - from: dataset
    to: sample
  - from: sample
    to: augment
  - from: augment
    to: augmented
  - from: augmented
    to: model
    fromAnchor: south
    toAnchor: north
    label: batch
  - from: model
    to: loss
    label: ŷ
  - from: dataset
    to: loss
    fromAnchor: south
    toAnchor: north:0.85
    label: $y$
    variant: dashed
  - from: loss
    to: optimizer
    label: $\nabla_\theta L$
  - from: optimizer
    to: model
    fromAnchor: south
    toAnchor: south
    label: update $\theta$
    variant: dashed
  - from: loss
    to: curve
    component: line
    variant: dashed
