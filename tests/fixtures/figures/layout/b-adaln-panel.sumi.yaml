# One panel of figure B of #86 (docs/research/86-paper-figures.md §2.3): the
# structured layout of research/86-paper-figures/figures/ideal/b-adaln-panel.sumi.yaml
# with the real operator / junction components and tones (#92), adapted only
# where a later issue owns the feature:
#   - no `requires: ">=0.5.0"`;
#   - caption (stage B) → removed;
#   - label math (#93)  → plain text.
# It exercises a shared bus (one source port, four taps) and edge labels next
# to the arrowheads (#90).
version: 1
figure:
  id: dit-adaln-block
  theme: academic
  profile: paper-single
  layout:
    engine: structured
    arrange:
      stack: { items: [panel] }

groups:
  - id: panel
    arrange:
      row:
        gap: 6mm
        align: end
        items:
          - stack:
              direction: up
              gap: 2mm
              align: stretch
              items:
                [tokens, split0, ln1, ss1, attn, scale1, add1, split1, ln2, ss2, ff, scale2, add2, out]
          - stack: { direction: up, gap: 6mm, items: [conditioning, mlp] }

nodes:
  - { id: tokens, component: box, label: Input Tokens, tone: gray }
  - { id: split0, component: junction }
  - { id: ln1, component: box, label: Layer Norm, tone: blue }
  - { id: ss1, component: box, label: "Scale, Shift", tone: blue }
  - { id: attn, component: box, label: "Multi-Head\nSelf-Attention", tone: orange }
  - { id: scale1, component: box, label: Scale, tone: blue }
  - { id: add1, component: operator, props: { symbol: plus } }
  - { id: split1, component: junction }
  - { id: ln2, component: box, label: Layer Norm, tone: blue }
  - { id: ss2, component: box, label: "Scale, Shift", tone: blue }
  - { id: ff, component: box, label: "Pointwise\nFeedforward", tone: green }
  - { id: scale2, component: box, label: Scale, tone: blue }
  - { id: add2, component: operator, props: { symbol: plus } }
  - { id: out, component: junction }
  - { id: conditioning, component: box, label: Conditioning, tone: blue }
  - { id: mlp, component: box, label: MLP, tone: blue }

edges:
  - { from: tokens, to: split0, component: line }
  - { from: split0, to: ln1 }
  - { from: split0, to: add1, toAnchor: west } # residual
  - { from: ln1, to: ss1, component: line }
  - { from: ss1, to: attn, component: line }
  - { from: attn, to: scale1, component: line }
  - { from: scale1, to: add1 }
  - { from: add1, to: split1, component: line }
  - { from: split1, to: ln2 }
  - { from: split1, to: add2, toAnchor: west } # residual
  - { from: ln2, to: ss2, component: line }
  - { from: ss2, to: ff, component: line }
  - { from: ff, to: scale2, component: line }
  - { from: scale2, to: add2 }
  - { from: add2, to: out }
  - { from: conditioning, to: mlp, component: line }
  # one source port, four taps: routed as a single shared bus (#90)
  - { from: mlp, fromAnchor: north, to: ss1, toAnchor: east, label: "gamma1, beta1" }
  - { from: mlp, fromAnchor: north, to: scale1, toAnchor: east, label: alpha1 }
  - { from: mlp, fromAnchor: north, to: ss2, toAnchor: east, label: "gamma2, beta2" }
  - { from: mlp, fromAnchor: north, to: scale2, toAnchor: east, label: alpha2 }
