# labelRotation (#178): H3-World's "Query" axis label and its tall
# "Visual VAE Encoder" box, turned -90°, and labels turned 90° with label math
# (an accent and scripts) and two lines of different widths.
version: 1
figure:
  id: label-rotation
  theme: academic
  layout:
    arrange:
      row:
        gap: 8mm
        items: [query, vae, stack, out]
groups:
  - id: stack
    label: Blocks
    arrange: { stack: { gap: 4mm, items: [a, b, c] } }
nodes:
  - { id: query, component: label, label: Query, labelRotation: -90 }
  - { id: vae, component: box, label: Visual VAE Encoder, labelRotation: -90, props: { height: 120pt } }
  - { id: a, component: box, label: Patch embed }
  - { id: b, component: box, label: "Math $\\hat{x}_t^2$", labelRotation: 90 }
  - { id: c, component: box, label: "Two\nmuch longer lines", labelRotation: 90 }
  - { id: out, component: box, label: Output }
edges:
  - { from: query, to: vae }
  - { from: vae, to: stack }
  - { from: stack, to: out }
