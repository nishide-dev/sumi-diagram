# #217: the unconstrained junction approach turns only 3.4 units before an
# 8-unit arrowhead. The router must choose a longer approach (or diagnose it).
version: 1
figure:
  id: arrowhead-on-bend
  theme: paper
  layout:
    arrange:
      row: { gap: 20pt, items: [source, target] }
nodes:
  - { id: source, component: box, label: Source }
  - { id: target, component: junction, variant: hidden }
edges:
  - { id: bent, from: source, to: target, fromAnchor: "east:0.6", tone: blue }
