# #94: a PNG, a JPEG and an SVG image and two bundled icons, laid out by the
# structured engine. The images are self-made (tests/fixtures/assets/).
version: 1
figure:
  id: images
  theme: color
  profile: paper-double
  layout:
    arrange:
      row:
        gap: 3mm
        align: center
        items: [png, jpeg, svg, sine, flame]

nodes:
  - id: png
    component: image
    props: { src: gradient.png, height: 34pt }
  - id: jpeg
    component: image
    variant: framed
    props: { src: gradient.jpg, width: 45pt, fit: cover, height: 22.5pt }
  - id: svg
    component: image
    props: { src: shapes.svg, width: 56pt }
  - { id: sine, component: circle, icon: tabler/wave-sine }
  - { id: flame, component: box, icon: tabler/flame, tone: orange }

edges:
  - { from: png, to: jpeg }
  - { from: jpeg, to: svg }
  - { from: svg, to: sine, component: line }
  - { from: sine, to: flame }
