name: Feature / Task
description: 機能追加・作業タスクの提案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **タイトルは英語**で、内容を表す短文にしてください（例: `Add component manifest loader`）。本文は日本語で記述してください。
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: なぜこの作業が必要か
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 作業内容
      description: 具体的に行うこと
      placeholder: |
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連
      description: 親 Issue・依存する Issue など
      placeholder: "親 Issue: #236"
