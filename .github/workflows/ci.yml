name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned by full commit SHA (tag in the comment).
jobs:
  # Platform-independent checks: run once.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: JSON Schema up to date
        run: bun run schema:check

      # The bundled icon archive (#94) is the pinned npm package's outline icons
      # without the Brand category (downloads the package and checks its integrity).
      - name: Icon archive matches the pinned Tabler Icons
        run: bun run icons:check
      - name: Verify bundled emoji
        run: bun run emoji:check

  # The full suite with the pinned D2 on Linux and macOS: unit tests, the D2
  # integration tests (required here because CI is set) and the byte-for-byte
  # SVG goldens of the examples and the gallery, so rendering determinism is
  # checked on both platforms.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            coverage: true
          - os: macos-latest
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache D2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sumi/bin
          key: d2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/backends/d2/version.ts') }}

      # Pinned, checksum-verified D2 CLI (src/backends/d2/version.ts).
      - name: Install D2
        run: bun run d2:install

      # Records the environment the goldens were checked in: OS, Bun
      # (.bun-version), D2 (src/backends/d2/version.ts) and the sha256 of each
      # bundled font (src/core/theme/fonts.ts). Fails early if any is off.
      - name: Environment
        run: |
          uname -a
          if [ "$RUNNER_OS" = "macOS" ]; then sw_vers; fi
          bun src/cli/index.ts doctor
          bun src/cli/index.ts doctor --json

      - name: Test
        run: bun test ${{ matrix.coverage && '--coverage' || '' }}

      # Re-renders docs/gallery/ and examples/*/*.svg; fails if they are stale.
      - name: Gallery and examples up to date
        run: bun run gallery:check

  # The independent Open XML SDK is test-only, never bundled with the CLI.
  pptx-schema:
    name: PPTX Open XML validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Generate picture PPTX corpus and fallback controls
        run: bun scripts/check-pptx.ts
      - name: Generate experimental DrawingML PPTX corpus and connector controls
        run: bun scripts/check-pptx-editable.ts
      - name: Validate Office 2019 schema with pinned Open XML SDK
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet build scripts/pptx-validator/Validator.csproj --configuration Release --artifacts-path .sumi/pptx-validator -p:RestoreLockedMode=true
          dotnet .sumi/pptx-validator/bin/Validator/release/Validator.dll .sumi/pptx/*.pptx .sumi/pptx-editable/*.pptx
      - name: Keep app-compatibility fixtures and alternate-PNG controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pptx-compatibility-fixtures
          path: .sumi/pptx/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Keep editable DrawingML compatibility fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pptx-editable-fixtures
          path: .sumi/pptx-editable/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Real LaTeX consumers of the generated PDFs (#63). TeX/Poppler are test-only
  # dependencies, isolated from the normal unit suite and release binaries.
  pdf-latex:
    name: PDF LaTeX inclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install TeX and Poppler (test only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-luatex lmodern poppler-utils

      - name: Cache D2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sumi/bin
          key: d2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/backends/d2/version.ts') }}

      - name: Install D2
        run: bun run d2:install

      - name: Verify PDF inclusion in pdfLaTeX and LuaLaTeX
        run: bun run pdf:latex

      - name: Keep TeX logs, PDFs, raster comparisons and environment report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-latex
          path: .sumi/pdf-latex/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Reproducible build of the PDF engine (#59): rebuilds
  # assets/wasm/sumi-pdf.wasm from native/pdf-wasm with the toolchain
  # pinned in rust-toolchain.toml (unmodified, checksum-pinned crates.io packages)
  # and fails if it, its sha256 in src/render/pdf/engine.ts, or the
  # generated third-party list and license files differ from what is
  # committed. The other jobs use the committed module and need no Rust.
  pdf-wasm:
    name: PDF engine reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The toolchain and the crate sources only; the build itself is never
      # cached, so every run compiles from source.
      - name: Cache Rust toolchain and crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/pdf-wasm/rust-toolchain.toml', 'native/pdf-wasm/Cargo.lock') }}

      - name: Build the PDF engine
        run: bun run pdf:wasm

      - name: Committed module and licenses match the build
        run: |
          sha256sum assets/wasm/sumi-pdf.wasm
          git diff --stat --exit-code -- assets/wasm native src/render/pdf
          untracked="$(git status --porcelain --untracked-files=all -- assets/wasm native src/render/pdf)"
          if [ -n "$untracked" ]; then echo "$untracked"; exit 1; fi

      # On a mismatch, keep what this runner built for comparison.
      - name: Upload the rebuilt module
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sumi-pdf-wasm-linux
          path: assets/wasm/sumi-pdf.wasm
          retention-days: 7

  # Keeps the release path from rotting (#20): builds the linux-x64 tarball
  # exactly as release.yml does and runs the same smoke test (extract to a path
  # with a space, run outside the checkout without Bun/Node on PATH: --version,
  # doctor, a Japanese-label render). The other targets run in release.yml.
  release:
    name: Release smoke (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The D2 release tarball; the build re-verifies its sha256 on every use.
      - name: Cache D2 release tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sumi/cache
          key: d2-tarball-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/backends/d2/version.ts') }}

      - name: Build tarball
        run: bun run release:build --target linux-x64

      - name: Smoke test
        run: bun run release:smoke "dist/release/sumi-$(jq -r .version package.json)-linux-x64.tar.gz"
