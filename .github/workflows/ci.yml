name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache D2
        uses: actions/cache@v4
        with:
          path: .sumi/bin
          key: d2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/backends/d2/version.ts') }}

      # Pinned, checksum-verified D2 CLI for the integration tests.
      - name: Install D2
        run: bun run d2:install

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: JSON Schema up to date
        run: bun run schema:check

      # Re-renders docs/gallery/ and examples/*/*.svg; fails if they are stale.
      - name: Gallery and examples up to date
        run: bun run gallery:check
