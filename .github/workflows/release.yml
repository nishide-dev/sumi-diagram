# Third-party actions are pinned by full commit SHA (tag in the comment), as in ci.yml.
#
# Builds the release tarballs on native runners, smoke-tests each one on the
# runner that built it, and publishes a GitHub Release (design doc §6.8, #20).
# The procedure (version bump, release notes, tag) is in CONTRIBUTING.md.
#
# workflow_dispatch is a dry run: it builds and smoke-tests every target at
# package.json's version and uploads the tarballs as workflow artifacts, but
# never creates a release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          pkg_version="$(jq -r .version package.json)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$pkg_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version."
              exit 1
            fi
          else
            version="$pkg_version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require release notes and a license
        if: github.ref_type == 'tag'
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$notes" || { echo "::error::Missing release notes $notes."; exit 1; }
          test -s LICENSE || { echo "::error::The repository has no LICENSE; add one before publishing binaries."; exit 1; }

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs-on: macos-15
          - target: darwin-x64
            runs-on: macos-15-intel
          - target: linux-x64
            runs-on: ubuntu-24.04
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Native runners only: the build runs the staged binaries and the smoke
      # test must exercise the real platform.
      - name: Check the runner matches the target
        run: test "$(bun -e 'console.log(`${process.platform}-${process.arch}`)')" = "$TARGET"

      # The same committed WASM and corpus hashes on all four OS/CPU targets.
      - name: PDF/PPTX byte equality and format contracts
        run: bun test --timeout 60000 src/render/pdf src/render/pptx

      - name: Build tarball
        run: bun run release:build --target "$TARGET" --version "$VERSION"

      # Extracts into a temp dir with a space in its path and runs sumi from
      # outside the checkout with PATH limited to system dirs (no Bun/Node).
      - name: Smoke test
        run: bun run release:smoke "dist/release/sumi-${VERSION}-${TARGET}.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sumi-${{ matrix.target }}
          path: |
            dist/release/sumi-*.tar.gz
            dist/release/sumi-*.tar.gz.sha256
          if-no-files-found: error

  release:
    # Only a pushed tag publishes; workflow_dispatch (even on a tag ref) is a dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          pattern: sumi-*
          merge-multiple: true

      - name: Assemble and verify SHA256SUMS
        working-directory: dist/release
        run: |
          count="$(ls sumi-*.tar.gz | wc -l)"
          test "$count" -eq 4 || { echo "::error::Expected 4 tarballs, found $count."; exit 1; }
          cat sumi-*.tar.gz.sha256 | sort -k 2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sumi $TAG" \
            --notes-file "docs/releases/${TAG}.md" \
            "${prerelease[@]}" \
            dist/release/sumi-*.tar.gz dist/release/SHA256SUMS
