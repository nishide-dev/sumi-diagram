# The README figure (#474, #493): how Sumi works with a coding agent. The agent reads the
# catalog, writes the YAML, and the CLI compiles, lays out, renders and checks it; geometry
# diagnostics go back to the agent. `bun run gallery` renders it with the sumi and
# sumi-dark themes, background transparent, into architecture.{light,dark}.svg.
version: 1
figure:
  id: sumi-architecture
  title: How Sumi works with a coding agent
  theme: sumi
  profile: paper-double
  # A README figure read on screen, not in print: 6pt is legible at GitHub's width.
  target: { minFontSize: 6pt }
  layout:
    arrange:
      row: { gap: 10mm, align: center, items: [ agent, cli ] }

groups:
  - id: cli
    label: Sumi CLI
    arrange:
      grid:
        columns: 4
        rowGap: 5mm
        columnGap: 4mm
        items: [ catalog, ~, ~, out, yaml, compile, layout, render, ~, ~, { item: diag, span: 2 } ]

nodes:
  - id: agent
    component: box
    label: Coding agent
    sublabel: "with the Sumi Skill"
    props: { height: 85pt }
    variant: emphasis
  - id: catalog
    component: html
    props:
      viewport: 250x92
      width: 106pt
      html: |
        <div style="padding:8px 10px;background-color:var(--sumi-bg);color:var(--sumi-fg);border:1.5px solid var(--sumi-muted);border-radius:6px;font-family:var(--sumi-mono);font-size:15px;line-height:1.45">
          <div style="white-space:pre;color:var(--sumi-accent)">$ sumi catalog --json</div>
          <div style="white-space:pre">32 components · 8 themes</div>
          <div style="white-space:pre">8 palettes · 3 profiles</div>
        </div>
  - id: yaml
    component: html
    props:
      viewport: 280x150
      width: 119pt
      html: |
        <div style="padding:8px 10px;background-color:var(--sumi-bg);color:var(--sumi-fg);border:1.5px solid var(--sumi-fg);border-radius:6px;font-family:var(--sumi-mono);font-size:15px;line-height:1.45">
          <div style="white-space:pre;color:var(--sumi-accent)">figure.sumi.yaml</div>
          <div style="white-space:pre">figure: { theme: sumi }</div>
          <div style="white-space:pre">nodes:</div>
          <div style="white-space:pre">- { id: api, component: box }</div>
          <div style="white-space:pre">edges:</div>
          <div style="white-space:pre">- { from: api, to: db }</div>
        </div>
  - { id: compile, component: box, label: Compile, sublabel: "→ figure IR" }
  - { id: layout, component: box, label: Layout, sublabel: "structured · D2" }
  - { id: render, component: box, label: Render, sublabel: "SVG · PDF · PPTX" }
  - id: out
    component: html
    props:
      viewport: 200x150
      width: 86pt
      html: |
        <div style="padding:8px;background-color:var(--sumi-bg);color:var(--sumi-fg);border:1.5px solid var(--sumi-fg);border-radius:6px;display:flex;flex-direction:column;gap:8px;font-family:var(--sumi-mono);font-size:14px">
          <div style="display:flex;align-items:center;gap:6px;height:64px">
            <div style="width:34px;height:26px;border:2px solid var(--sumi-fg);border-radius:3px"></div>
            <div style="width:18px;height:2px;background-color:var(--sumi-fg)"></div>
            <div style="width:34px;height:26px;border:2px solid var(--sumi-fg);border-radius:3px;background-color:var(--sumi-accent)"></div>
            <div style="width:18px;height:2px;background-color:var(--sumi-fg)"></div>
            <div style="width:34px;height:26px;border:2px solid var(--sumi-fg);border-radius:3px"></div>
          </div>
          <div style="white-space:pre;color:var(--sumi-accent)">figure.svg</div>
        </div>
  - id: diag
    component: html
    props:
      viewport: 300x118
      width: 127pt
      html: |
        <div style="padding:8px 10px;background-color:var(--sumi-bg);color:var(--sumi-fg);border:1.5px solid var(--sumi-accent);border-radius:6px;font-family:var(--sumi-mono);font-size:15px;line-height:1.45">
          <div style="white-space:pre;color:var(--sumi-accent)">$ sumi lint --geometry --json</div>
          <div style="white-space:pre">code: geometry/label-collision</div>
          <div style="white-space:pre">path: edges[2]</div>
          <div style="white-space:pre">hint: move the label …</div>
        </div>

edges:
  - { from: catalog, to: agent, toAnchor: "east:0.2" }
  - { from: agent, to: yaml, fromAnchor: "east:0.5" }
  - { from: yaml, to: compile }
  - { from: compile, to: layout }
  - { from: layout, to: render }
  - { from: render, to: out, toAnchor: straight }
  - { from: render, to: diag, toAnchor: straight, label: check }
  - { from: diag, to: agent, toAnchor: "east:0.8", label: diagnostics → fix, variant: dashed }
