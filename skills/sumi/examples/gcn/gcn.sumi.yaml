# Source: Kipf & Welling (2017), Semi-Supervised Classification with Graph
# Convolutional Networks, arXiv:1609.02907, Figure 1.
# https://arxiv.org/abs/1609.02907
# Panel (b) is an original synthetic point cloud: assets/generate.ts (no paper data).
version: 1
figure:
  id: gcn
  title: GCN — Graph Convolutional Network
  theme: paper
  themeOverrides:
    groupLabelWeight: regular
    # The original's palette: white cards with black frames, pale node fills,
    # frames and edges in the tone line colours, black node text.
    groupFill: "#ffffff"
    tones:
      blue: { fill: "#dfe1ea", line: "#5f6a95", text: "#000000" }
      orange: { fill: "#ffe6d3", line: "#fc8226", text: "#000000" }
      green: { fill: "#dcebe3", line: "#4a9a77", text: "#000000" }
      pink: { fill: "#eedee6", line: "#ab5982", text: "#000000" }
  profile: paper-double
  layout:
    align:
      - { y: [ x2, j1, j2 ] }
      - { y: [ z1, y1 ] }
      - { y: [ z4, y4 ] }
    arrange:
      row:
        gap: 10mm
        align: start
        items: [ network, activations ]
groups:
  - id: network
    variant: plain
    caption: (a) Graph Convolutional Network
    arrange:
      row:
        gap: 8mm
        items: [ input, { row: { gap: 16mm, items: [ j1, j2 ] } }, output, { stack: { gap: 4mm, items: [ y1, y4 ] } } ]
  - id: input
    label: $C$
    labelAt: top-left
    caption: input layer
    props: { layers: { count: 4, offset: 2pt } }
    arrange:
      place:
        unit: 5mm
        items:
          - { item: x1, at: [ 2.4, 0 ] }
          - { item: x2, at: [ 1.9, 2.1 ] }
          - { item: x3, at: [ 0.3, 3.9 ] }
          - { item: x4, at: [ 3.3, 4.6 ] }
  - id: output
    label: $F$
    labelAt: top-left
    caption: output layer
    props: { layers: { count: 5, offset: 2pt } }
    arrange:
      place:
        unit: 5mm
        items:
          - { item: z1, at: [ 2.4, 0 ] }
          - { item: z2, at: [ 1.9, 2.1 ] }
          - { item: z3, at: [ 0.3, 3.9 ] }
          - { item: z4, at: [ 3.3, 4.6 ] }
  - id: activations
    variant: plain
    caption: (b) Hidden layer activations
    arrange:
      stack: { items: [ tsne ] }
nodes:
  - { id: x1, component: circle, label: $X_1$, tone: blue, variant: tinted }
  - { id: x2, component: circle, label: $X_2$, tone: orange, variant: tinted }
  - { id: x3, component: circle, label: $X_3$, tone: green, variant: tinted }
  - { id: x4, component: circle, label: $X_4$, tone: pink, variant: tinted }
  - { id: z1, component: circle, label: $Z_1$, tone: blue, variant: tinted }
  - { id: z2, component: circle, label: $Z_2$, tone: orange, variant: tinted }
  - { id: z3, component: circle, label: $Z_3$, tone: green, variant: tinted }
  - { id: z4, component: circle, label: $Z_4$, tone: pink, variant: tinted }
  - { id: y1, component: circle, label: $Y_1$, tone: blue, variant: tinted }
  - { id: y4, component: circle, label: $Y_4$, tone: pink, variant: tinted }
  - { id: j1, component: junction, variant: hidden }
  - { id: j2, component: junction, variant: hidden }
  - { id: tsne, component: image, props: { src: assets/tsne.svg, width: 136pt } }
edges:
  # The graph structure, shared over layers.
  - { from: x1, to: x2, component: line, route: straight }
  - { from: x2, to: x3, component: line, route: straight }
  - { from: x2, to: x4, component: line, route: straight }
  - { from: z1, to: z2, component: line, route: straight }
  - { from: z2, to: z3, component: line, route: straight }
  - { from: z2, to: z4, component: line, route: straight }
  # Every input node feeds the hidden layers, which feed every output node.
  - { from: x1, to: j1, component: line, route: curve, tone: blue }
  - { from: x2, to: j1, component: line, route: curve, tone: orange }
  - { from: x3, to: j1, component: line, route: curve, tone: green }
  - { from: x4, to: j1, component: line, route: curve, tone: pink }
  - { from: j1, to: j2, component: line, variant: dashed, label: "hidden\nlayers", labelSide: right }
  - { from: j2, to: z1, route: curve, tone: orange }
  - { from: j2, to: z2, route: curve, tone: pink }
  - { from: j2, to: z3, route: curve, tone: green }
  - { from: j2, to: z4, route: curve, tone: pink }
  # Labels for the labelled nodes.
  - { from: z1, to: y1, component: double-arrow, variant: dashed, tone: blue }
  - { from: z4, to: y4, component: double-arrow, variant: dashed, tone: pink }
