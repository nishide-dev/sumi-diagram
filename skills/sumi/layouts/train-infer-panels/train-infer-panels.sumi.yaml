# Layout: two side-by-side panels (training | inference) whose stages share weights.
#
# Use when: one model is used in two modes and the figure must show what differs (the data
#   going in and the iteration at inference) while the model stages stay visibly the same
#   (pretraining vs sampling, teacher vs student, fit vs deploy).
# Structure: row of two plain panels with stacked content; `align` pins matching stages to
#   the same height; dashed double arrows between the panels carry "shared weights";
#   token rows for the data (blue token, gray mask, green prediction), a dashed group for the
#   loop, a legend underneath.
# Change: the labels and token texts; the number of stages (keep both panels' stages in
#   `align`); the legend entries; drop the dashed group if inference does not iterate.
# Lint: `lint --geometry` 0 errors, 0 warnings; one info, geometry/sparse-figure (25%
#   coverage): the wide panel gap and legend row are deliberate; keep the gap if you add content.
version: 1
figure:
  id: train-infer-panels
  theme: sumi
  profile: paper-double
  layout:
    density: compact
    arrange:
      stack:
        gap: 3mm
        align: start
        items:
          - row: {gap: 18mm, align: start, items: [train, infer]}
          - key
    align:
      - {y: [train_enc, infer_enc]}
      - {y: [train_dec, infer_dec]}
      - {y: [pred_a, gen_seq]}
      - {x: [train_in.2, pred_a.p2]}
      - {x: [train_in.4, pred_b.p4]}
      - {y: [train_loss, infer_out]}
groups:
  - id: train
    label: (a) Training
    labelAt: top-left
    variant: plain
    arrange:
      stack: {gap: 5mm, items: [{stack: {gap: 1.5mm, items: [train_cap, train_in]}}, train_enc, train_dec, {row: {gap: 22pt, items: [pred_a, pred_b]}}, train_loss]}
  - id: infer
    label: (b) Inference
    labelAt: top-left
    variant: plain
    arrange:
      stack: {gap: 5mm, items: [{stack: {gap: 1.5mm, items: [infer_cap, infer_in]}}, infer_enc, gen, infer_out]}
  - id: gen
    label: Iterate T times
    labelAt: bottom-left
    variant: dashed
    arrange:
      stack: {gap: 4mm, items: [infer_dec, gen_seq]}
nodes:
  # training
  - {id: train_cap, component: label, variant: muted, label: Input with some positions masked}
  - id: train_in
    component: tokens
    tone: blue
    props:
      gap: 0
      width: 22pt
      height: 15pt
      cells:
        - '$x_1$'
        - {label: M, tone: gray}
        - '$x_3$'
        - {label: M, tone: gray}
        - {label: M, tone: gray}
        - '$x_6$'
  - {id: train_enc, component: box, label: Stage A, tone: blue, variant: tinted, props: {width: 135pt}}
  - {id: train_dec, component: box, label: Stage B, tone: orange, variant: tinted, props: {width: 135pt}}
  - id: pred_a
    component: tokens
    tone: green
    props:
      gap: 0
      width: 22pt
      height: 15pt
      cells:
        - {id: p2, label: '$\hat{x}_2$'}
  - id: pred_b
    component: tokens
    tone: green
    props:
      gap: 0
      width: 22pt
      height: 15pt
      cells:
        - {id: p4, label: '$\hat{x}_4$'}
        - {id: p5, label: '$\hat{x}_5$'}
  - {id: pred_note, component: label, variant: muted, label: predictions, attach: {to: pred_b, side: east, gap: 3pt}}
  - {id: train_loss, component: box, variant: emphasis, label: Loss on masked positions, props: {width: 135pt}}
  # inference
  - {id: infer_cap, component: label, variant: muted, label: Given part + masked rest}
  - id: infer_in
    component: tokens
    tone: blue
    props:
      gap: 0
      width: 22pt
      height: 15pt
      cells:
        - '$x_1$'
        - '$x_2$'
        - '$x_3$'
        - {label: M, tone: gray}
        - {label: M, tone: gray}
        - {label: M, tone: gray}
  - {id: infer_enc, component: box, label: Stage A, tone: blue, variant: tinted, props: {width: 135pt}}
  - {id: infer_dec, component: box, label: Stage B, tone: orange, variant: tinted, props: {width: 135pt}}
  - id: gen_seq
    component: tokens
    tone: blue
    props:
      gap: 0
      width: 22pt
      height: 15pt
      cells:
        - '$x_1$'
        - '$x_2$'
        - '$x_3$'
        - {label: '$\hat{y}_4$', tone: green}
        - {label: M, tone: gray}
        - {label: '$\hat{y}_6$', tone: green}
  - id: infer_out
    component: tokens
    tone: blue
    props:
      gap: 0
      width: 22pt
      height: 15pt
      cells:
        - '$x_1$'
        - '$x_2$'
        - '$x_3$'
        - {label: '$\hat{y}_4$', tone: green}
        - {label: '$\hat{y}_5$', tone: green}
        - {label: '$\hat{y}_6$', tone: green}
  - {id: out_note, component: label, variant: muted, label: output, attach: {to: infer_out, side: east, gap: 3pt}}
  # key
  - id: key
    component: legend
    variant: plain
    props:
      flow: row
      entries:
        - {node: {tone: blue}, label: token}
        - {node: {tone: gray}, label: mask}
        - {node: {tone: green}, label: prediction}
edges:
  # training flow
  - {from: train_in, to: train_enc}
  - {from: train_enc, to: train_dec}
  - {from: train_dec, to: pred_a.p2, fromAnchor: straight}
  - {from: train_dec, to: pred_b.p4, fromAnchor: straight}
  - {from: train_dec, to: pred_b.p5, fromAnchor: straight}
  - {from: pred_a.p2, to: train_loss, toAnchor: straight}
  - {from: pred_b.p4, to: train_loss, toAnchor: straight}
  - {from: pred_b.p5, to: train_loss, toAnchor: straight}
  # inference flow
  - {from: infer_in, to: infer_enc}
  - {from: infer_enc, to: infer_dec}
  - {from: infer_dec, to: gen_seq}
  - {from: gen_seq, to: infer_dec, fromAnchor: east, toAnchor: east, label: "refine, ×T"}
  - {from: gen, to: infer_out}
  # shared weights
  - {from: train_enc, to: infer_enc, component: double-arrow, variant: dashed, label: shared weights, labelAt: start}
  - {from: train_dec, to: infer_dec, component: double-arrow, variant: dashed, label: shared weights, labelAt: start}
