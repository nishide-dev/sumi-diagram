# Layout: an ablation grid, one row per variant, the same pipeline with components removed.
#
# Use when: an ablation study removes one component at a time and the figure must show which
#   part each variant lacks next to its result (full model vs w/o A vs w/o B, with and
#   without a loss term, module on/off).
# Structure: a `grid` of 6 columns (row title, four pipeline slots, score) under a header row
#   of muted labels (`~` leaves the slot cells blank); every component stays in its column in
#   every row; a removed component is the same box drawn `dashed` without its tone, so the
#   flow still passes through it (read: replaced by identity); one tone per component (blue,
#   orange); the full model's title and score `weight: bold`; a legend below.
# Change: the row titles, component labels and scores; a component = one more column (and its
#   tone and legend entry); a variant = one more row of six items; for "w/o A and B" draw both
#   dashed. Replace the "00.0" placeholders with the real numbers.
# Lint: `lint --geometry` 0 errors, 0 warnings, no infos.
version: 1
figure:
  id: ablation-grid
  theme: sumi
  profile: paper-double
  layout:
    density: compact
    arrange:
      stack:
        gap: 4mm
        items:
          - grid:
              columns: 6
              rowGap: 5mm
              columnGap: 6mm
              align: start
              items:
                [h_variant, ~, ~, ~, ~, h_score,
                 t1, i1, a1, b1, o1, s1,
                 t2, i2, a2, b2, o2, s2,
                 t3, i3, a3, b3, o3, s3]
          - key
nodes:
  - {id: h_variant, component: label, label: Variant, variant: muted}
  - {id: h_score, component: label, label: Score, variant: muted}
  - {id: t1, component: label, label: Full model, weight: bold}
  - {id: i1, component: box, label: Input, variant: muted}
  - {id: a1, component: box, label: Comp. A, tone: blue, variant: tinted}
  - {id: b1, component: box, label: Comp. B, tone: orange, variant: tinted}
  - {id: o1, component: box, label: Head}
  - {id: s1, component: label, label: "00.0", weight: bold}
  - {id: t2, component: label, label: w/o Comp. A}
  - {id: i2, component: box, label: Input, variant: muted}
  - {id: a2, component: box, label: Comp. A, variant: dashed}
  - {id: b2, component: box, label: Comp. B, tone: orange, variant: tinted}
  - {id: o2, component: box, label: Head}
  - {id: s2, component: label, label: "00.0"}
  - {id: t3, component: label, label: w/o Comp. B}
  - {id: i3, component: box, label: Input, variant: muted}
  - {id: a3, component: box, label: Comp. A, tone: blue, variant: tinted}
  - {id: b3, component: box, label: Comp. B, variant: dashed}
  - {id: o3, component: box, label: Head}
  - {id: s3, component: label, label: "00.0"}
  - id: key
    component: legend
    variant: plain
    props:
      flow: row
      entries:
        - {node: {tone: blue, variant: tinted}, label: component A}
        - {node: {tone: orange, variant: tinted}, label: component B}
        - {node: {variant: dashed}, label: removed (identity)}
edges:
  - {from: i1, to: a1}
  - {from: a1, to: b1}
  - {from: b1, to: o1}
  - {from: i2, to: a2}
  - {from: a2, to: b2}
  - {from: b2, to: o2}
  - {from: i3, to: a3}
  - {from: a3, to: b3}
  - {from: b3, to: o3}
