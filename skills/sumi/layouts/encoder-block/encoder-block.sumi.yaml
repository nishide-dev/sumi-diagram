# Layout: an overview panel plus one repeated block drawn open (encoder block with residuals).
#
# Use when: a model is a stack of identical blocks and the reader needs both the whole
#   pipeline (input -> pieces -> embedding -> stack -> head) and what one block does,
#   with skip connections around its sub-layers (transformer, ResNet, U-Net stage).
# Structure: row of two plain panels, (a) placed by `place` coordinates (unit 1 mm),
#   (b) a bottom-up stack inside a framed group; `zoom` edge joins the stack box to the block;
#   hidden junctions split each residual; the three norm -> mixing edges use fixed anchors.
# Change: the labels; the number of sub-layers (per sub-layer copy its split junction, norm,
#   layer and add nodes with their edges: junction -> norm, norm -> layer, layer -> add and
#   the residual junction -> add, then list them in the block stack); the tones (blue input,
#   orange mixing, green transform); move the `place` coordinates only together.
# Lint: `lint --geometry` 0 errors, 0 warnings, no infos.
version: 1
figure:
  id: encoder-block
  theme: sumi
  profile: paper-double
  themeOverrides:
    lineWidth: 0.75pt
    frameWidth: 0.75pt
    arrowheadScale: 0.6
    solidFills: {gray: "#30364f"}
  layout:
    arrange:
      row:
        gap: 14mm
        align: stretch
        items: [overview, detail]

groups:
  - id: overview
    variant: plain
    caption: (a) Overview
    arrange:
      place:
        unit: 1mm
        items:
          - {item: cls-out, at: [24.8, 6]}
          - {item: head, at: [24.8, 18]}
          - {item: encoder, at: [53.8, 33]}
          - {item: emb, at: [45.5, 53.3]}
          - {item: linear, at: [57.0, 66.5]}
          - {item: patches, at: [57.0, 78.8]}
          - {item: image, at: [9.8, 78.8]}
  - id: detail
    variant: plain
    caption: (b) Encoder block
    arrange:
      stack:
        direction: up
        items: [embedded, block, output]
  - id: block
    arrange:
      stack:
        direction: up
        align: stretch
        items:
          - split1
          - norm1
          - attn
          - add1
          - split2
          - norm2
          - mlp
          - add2

nodes:
  # (a) overview
  - id: image
    component: tokens
    tone: blue
    props:
      component: square
      variant: tinted
      width: 12pt
      height: 12pt
      gap: 1pt
      lineGap: 1pt
      lines: [["", "", ""], ["", "", ""], ["", "", ""]]
  - {id: image-label, component: label, label: Input, attach: {to: image, side: south, gap: 1.5mm}}
  - id: patches
    component: tokens
    tone: blue
    props:
      variant: tinted
      width: 16pt
      height: 17pt
      gap: 2pt
      cells: ["", "", "", "", "", "", "", "", ""]
  - {id: patches-label, component: label, variant: muted, label: Pieces, attach: {to: patches, side: south, gap: 1.5mm}}
  - {id: linear, component: box, label: Projection, tone: gray, props: {width: 160pt, height: 20pt}}
  - id: emb
    component: tokens
    tone: blue
    props:
      variant: tinted
      width: 16pt
      gap: 2pt
      lineGap: 1.5pt
      lines:
        - - {id: p0, label: "0", tone: gray, height: 12pt}
          - {id: p1, label: "1", tone: gray, height: 12pt}
          - {label: "2", tone: gray, height: 12pt}
          - {label: "3", tone: gray, height: 12pt}
          - {label: "4", tone: gray, height: 12pt}
          - {label: "5", tone: gray, height: 12pt}
          - {label: "6", tone: gray, height: 12pt}
          - {label: "7", tone: gray, height: 12pt}
          - {label: "8", tone: gray, height: 12pt}
          - {label: "9", tone: gray, height: 12pt}
        - - {id: cls, label: "*", variant: solid, tone: gray, height: 17pt}
          - {id: e1, label: "", height: 17pt}
          - {label: "", height: 17pt}
          - {label: "", height: 17pt}
          - {label: "", height: 17pt}
          - {label: "", height: 17pt}
          - {label: "", height: 17pt}
          - {label: "", height: 17pt}
          - {label: "", height: 17pt}
          - {label: "", height: 17pt}
  - {id: pos-label, component: label, label: Position, attach: {to: emb.p0, side: west, gap: 1.5mm}}
  - {id: emb-label, component: label, label: Embedding, attach: {to: emb.cls, side: west, gap: 1.5mm}}
  - {id: cls-label, component: label, variant: muted, label: "special\ntoken", attach: {to: emb.cls, side: south, gap: 1mm}}
  - {id: encoder, component: box, variant: emphasis, label: Stack of blocks, props: {width: 180pt, height: 28pt}}
  - {id: head, component: box, label: Head, tone: green, props: {width: 56pt}}
  - {id: cls-out, component: label, label: Output}
  # (b) encoder block
  - {id: embedded, component: label, label: Block input}
  - {id: split1, component: junction, variant: hidden}
  - {id: norm1, component: box, label: Norm, tone: gray, props: {width: 80pt}}
  - {id: attn, component: box, label: "Mixing\nlayer", tone: orange}
  - {id: add1, component: operator, props: {symbol: plus}}
  - {id: split2, component: junction, variant: hidden}
  - {id: norm2, component: box, label: Norm, tone: gray}
  - {id: mlp, component: box, label: Feed-forward, tone: green}
  - {id: add2, component: operator, props: {symbol: plus}}
  - {id: output, component: label, label: Block output}
  - {id: repeat, component: label, label: "N×", attach: {to: block, side: east, gap: 2mm}}

edges:
  # (a)
  - {from: image, to: patches, label: split}
  - {from: patches, to: linear}
  - {from: linear, to: emb, toAnchor: straight}
  - {from: emb, to: encoder, toAnchor: straight}
  - {from: encoder, to: head, fromAnchor: straight}
  - {from: head, to: cls-out}
  - {from: encoder, to: block, component: zoom}
  # (b)
  - {from: embedded, to: split1, component: line}
  - {from: split1, to: norm1}
  - {from: norm1, fromAnchor: "north:0.2", to: attn, toAnchor: "south:0.2"}
  - {from: norm1, to: attn, toAnchor: "south:0.5"}
  - {from: norm1, fromAnchor: "north:0.8", to: attn, toAnchor: "south:0.8"}
  - {from: attn, to: add1}
  - {from: split1, to: add1, toAnchor: west}
  - {from: add1, to: split2, component: line}
  - {from: split2, to: norm2}
  - {from: norm2, to: mlp}
  - {from: mlp, to: add2}
  - {from: split2, to: add2, toAnchor: west}
  - {from: add2, to: output}
