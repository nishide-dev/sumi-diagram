# #181: research/167-stage-c/figures/c-h3world.sumi.yaml (#167 figure C, H3-World)
# with its token cells written as `component: tokens` by
# research/181-tokens/rewrite.ts; nothing else is changed.
version: 1
figure:
  id: stage-c-h3world
  theme: color
  profile: paper-double
  layout:
    arrange:
      stack:
        gap: 3mm
        align: stretch
        items:
          - build
          - row: { gap: 3mm, align: stretch, items: [ adapt, lora ] }
    align:
      - { y: [ visual-heading, frame0 ] }
      - { y: [ action-heading, k0-move.3 ] }
      - { y: [ first-frame, prompt0 ] }
      - { y: [ first-encoder, enc0 ] }
      - { y: [ seq-heading, seq.static ] }

groups:
  - id: build
    label: (a) Build the packed H3-World sequence
    labelAt: top-left
    arrange:
      row:
        gap: 6mm
        align: start
        items:
          - stack: { gap: 2mm, align: center, items: [ visual-heading, action-heading, first-frame, first-encoder, seq-heading ] }
          - stack:
              gap: 2.5mm
              align: stretch
              items:
                - row:
                    gap: 10pt
                    items:
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame0, frame0-label ] } }, { row: { gap: 1.5mm, items: [ k0-move, k0-look ] } }, prompt0, enc0 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame1, frame1-label ] } }, { row: { gap: 1.5mm, items: [ k1-move, k1-look ] } }, prompt1, enc1 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame2, frame2-label ] } }, { row: { gap: 1.5mm, items: [ k2-move, k2-look ] } }, prompt2, enc2 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame3, frame3-label ] } }, { row: { gap: 1.5mm, items: [ k3-move, k3-look ] } }, prompt3, enc3 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame4, frame4-label ] } }, { row: { gap: 1.5mm, items: [ k4-move, k4-look ] } }, prompt4, enc4 ] }
                - refiner
                - seq
          - vae
  - id: adapt
    label: (b) Adapt the H3 block
    labelAt: top-left
    arrange:
      stack:
        gap: 3mm
        align: stretch
        items:
          - bt
          - b-block1
          - b-dots1
          - b-inner
          - b-dots2
          - b-block2
          - b-out
  - id: b-inner
    tone: blue
    arrange:
      stack: { gap: 2mm, align: stretch, items: [ b-attn, b-ffn ] }
  - id: lora
    label: (c) LoRA inside H3 self-attention
    labelAt: top-left
    variant: muted
    arrange:
      row:
        gap: 4mm
        align: center
        items:
          - ct
          - stack: { gap: 6mm, items: [ lora-in, qkv ] }
          - c-add-in
          - stack: { gap: 1.5mm, items: [ mask, mask-title ] }
          - stack: { gap: 6mm, items: [ lora-out, out-proj ] }
          - c-add-out
          - mask-key
  - id: mask
    arrange:
      stack:
        gap: 0
        items:
          - row: { gap: 0, items: [ mc-corner, mc-0, mc-1, mc-2, mc-3, mc-4, mc-5, mc-6, mc-7, mc-8 ] }
          - row: { gap: 0, items: [ mr-0, m-0-0, m-0-1, m-0-2, m-0-3, m-0-4, m-0-5, m-0-6, m-0-7, m-0-8 ] }
          - row: { gap: 0, items: [ mr-1, m-1-0, m-1-1, m-1-2, m-1-3, m-1-4, m-1-5, m-1-6, m-1-7, m-1-8 ] }
          - row: { gap: 0, items: [ mr-2, m-2-0, m-2-1, m-2-2, m-2-3, m-2-4, m-2-5, m-2-6, m-2-7, m-2-8 ] }
          - row: { gap: 0, items: [ mr-3, m-3-0, m-3-1, m-3-2, m-3-3, m-3-4, m-3-5, m-3-6, m-3-7, m-3-8 ] }
          - row: { gap: 0, items: [ mr-4, m-4-0, m-4-1, m-4-2, m-4-3, m-4-4, m-4-5, m-4-6, m-4-7, m-4-8 ] }
          - row: { gap: 0, items: [ mr-5, m-5-0, m-5-1, m-5-2, m-5-3, m-5-4, m-5-5, m-5-6, m-5-7, m-5-8 ] }
          - row: { gap: 0, items: [ mr-6, m-6-0, m-6-1, m-6-2, m-6-3, m-6-4, m-6-5, m-6-6, m-6-7, m-6-8 ] }
          - row: { gap: 0, items: [ mr-7, m-7-0, m-7-1, m-7-2, m-7-3, m-7-4, m-7-5, m-7-6, m-7-7, m-7-8 ] }
          - row: { gap: 0, items: [ mr-8, m-8-0, m-8-1, m-8-2, m-8-3, m-8-4, m-8-5, m-8-6, m-8-7, m-8-8 ] }

