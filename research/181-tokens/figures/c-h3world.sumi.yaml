  - { id: prompt0, component: box, tone: gray, label: "Character\nstands still,\ncamera holds\nsteady", props: { width: 72pt } }
  - { id: enc0, component: box, label: H3 Encoder, tone: purple, props: { width: 72pt } }
  - { id: k1-move, component: tokens, props: { gap: 0.5mm, component: square, width: 8.5pt, height: 8.5pt, lines: [ [W], [{ label: A, tone: orange }, S, D] ] } }
