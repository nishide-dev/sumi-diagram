[package]
name = "sumi-krilla-poc"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
krilla = { version = "=0.8.2", default-features = false }
krilla-svg = { version = "=0.8.1" }
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
fontdb = { version = "=0.23.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
