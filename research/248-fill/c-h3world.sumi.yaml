# #248: fill the projection/token columns; keep panel (c) at its natural height.
version: 1
requires: ">=0.6.0"
figure:
  id: lora-h3world
  theme: paper
  profile: paper-double
  fit: scale
  layout:
    density: compact
    arrange:
      stack:
        align: stretch
        items:
          - build
          - row: { align: start, items: [ adapt, lora ] }
    align:
      - { y: [ visual-heading, frame0 ] }
      - { y: [ action-heading, k0-move.3 ] }
      - { y: [ first-frame, enc0 ], at: end }
      - { y: [ first-encoder, refiner ] } # as in the original: level with the refiner
      - { y: [ seq-heading, seq.static ] }

groups:
  - id: build
    label: (a) Build the packed H3-World sequence
    variant: filled
    labelAt: top-left
    arrange:
      row:
        gap: 6mm
        align: start
        items:
          - stack: { gap: 0.5mm, align: center, items: [ visual-heading, action-heading, first-frame, first-encoder, seq-heading ] }
          - stack:
              align: stretch
              items:
                - row:
                    gap: 10pt
                    items:
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame0, frame0-label ] } }, { row: { gap: 1.5mm, items: [ k0-move, k0-look ] } }, prompt0, enc0 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame1, frame1-label ] } }, { row: { gap: 1.5mm, items: [ k1-move, k1-look ] } }, prompt1, enc1 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame2, frame2-label ] } }, { row: { gap: 1.5mm, items: [ k2-move, k2-look ] } }, prompt2, enc2 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame3, frame3-label ] } }, { row: { gap: 1.5mm, items: [ k3-move, k3-look ] } }, prompt3, enc3 ] }
                      - stack: { gap: 3mm, items: [ { stack: { gap: 0.5mm, items: [ frame4, frame4-label ] } }, { row: { gap: 1.5mm, items: [ k4-move, k4-look ] } }, prompt4, enc4 ] }
                - refiner
                - seq
          - vae
  - id: adapt
    label: (b) Adapt the H3 block
    variant: filled
    labelAt: top-left
    arrange:
      stack:
        align: stretch
        items:
          - bt
          - b-block1
          - b-dots1
          - b-inner
          - b-dots2
          - b-block2
          - b-out
  - id: b-inner
    tone: blue
    variant: filled
    arrange:
      stack: { align: stretch, items: [ b-attn, b-ffn ] }
  - id: lora
    label: (c) LoRA inside H3 self-attention
    labelAt: top-left
    variant: dashed
    arrange:
      row:
        align: stretch
        items:
          - stack: { gap: 1.5pt, justify: stretch, items: [ ct1, ct2, ct3, ct4, ct5, ct6, ct7, ct8, ct9 ] }
          - stack: { gap: 4mm, justify: stretch, items: [ lora-in, qkv ] }
          - c-add-in
          - row: { gap: 1mm, items: [ query-axis, mask ] }
          - stack: { gap: 4mm, justify: stretch, items: [ lora-out, out-proj ] }
          - c-add-out
          - stack: { items: [ mask-key ] }

nodes:
  # key clusters: pressed keys filled, the others outlined in the cluster's tone
  - { id: k0-move, component: tokens, tone: orange, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ W ], [ A, S, D ] ] } }
  - { id: k0-look, component: tokens, tone: blue, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ I, F ], [ J, K, L ] ] } }
  - { id: k1-move, component: tokens, tone: orange, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ W ], [ { label: A, variant: filled }, S, D ] ] } }
  - { id: k1-look, component: tokens, tone: blue, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ I, F ], [ J, K, L ] ] } }
  - { id: k2-move, component: tokens, tone: orange, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ W ], [ { label: A, variant: filled }, { label: S, variant: filled }, D ] ] } }
  - { id: k2-look, component: tokens, tone: blue, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ I, F ], [ J, K, { label: L, variant: filled } ] ] } }
  - { id: k3-move, component: tokens, tone: orange, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ W ], [ { label: A, variant: filled }, { label: S, variant: filled }, D ] ] } }
  - { id: k3-look, component: tokens, tone: blue, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ { label: I, variant: filled }, F ], [ J, K, { label: L, variant: filled } ] ] } }
  - { id: k4-move, component: tokens, tone: orange, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ W ], [ { label: A, variant: filled }, { label: S, variant: filled }, D ] ] } }
  - { id: k4-look, component: tokens, tone: blue, props: { component: square, variant: outlined, width: 11pt, height: 11pt, gap: 0.5mm, lineAlign: center, lines: [ [ I, { label: F, variant: filled } ], [ J, K, { label: L, variant: filled } ] ] } }
  - { id: frame0, component: image, variant: framed, props: { src: assets/frame-00.jpg, width: 72pt, height: 40.5pt, fit: cover } }
  - { id: frame0-label, component: label, label: '$I_0$' }
  - { id: prompt0, component: box, tone: gray, label: "Character\nstands still,\ncamera holds\nsteady", props: { width: 72pt }, variant: filled }
  - { id: enc0, component: box, label: H3 Encoder, tone: purple, variant: outlined, props: { width: 72pt } }
  - { id: frame1, component: image, variant: framed, props: { src: assets/frame-01.jpg, width: 72pt, height: 40.5pt, fit: cover } }
  - { id: frame1-label, component: label, label: '$I_{1-4}$' }
  - { id: prompt1, component: box, tone: gray, label: "Character\nstrafes left,\ncamera\nfollows him", props: { width: 72pt }, variant: filled }
  - { id: enc1, component: box, label: H3 Encoder, tone: purple, variant: outlined, props: { width: 72pt } }
  - { id: frame2, component: image, variant: framed, props: { src: assets/frame-05.jpg, width: 72pt, height: 40.5pt, fit: cover } }
  - { id: frame2-label, component: label, label: '$I_{5-8}$' }
  - { id: prompt2, component: box, tone: gray, label: "Walks back,\nstrafes left;\ncamera pans\nright slowly", props: { width: 72pt }, variant: filled }
  - { id: enc2, component: box, label: H3 Encoder, tone: purple, variant: outlined, props: { width: 72pt } }
  - { id: frame3, component: image, variant: framed, props: { src: assets/frame-09.jpg, width: 72pt, height: 40.5pt, fit: cover } }
  - { id: frame3-label, component: label, label: '$I_{9-12}$' }
  - { id: prompt3, component: box, tone: gray, label: "Walks back,\nstrafes left;\npans right,\ntilts up", props: { width: 72pt }, variant: filled }
  - { id: enc3, component: box, label: H3 Encoder, tone: purple, variant: outlined, props: { width: 72pt } }
  - { id: frame4, component: image, variant: framed, props: { src: assets/frame-13.jpg, width: 72pt, height: 40.5pt, fit: cover } }
  - { id: frame4-label, component: label, label: '$I_{13-16}$' }
  - { id: prompt4, component: box, tone: gray, label: "Walks back,\nstrafes left;\ncamera pans\nright sharply", props: { width: 72pt }, variant: filled }
  - { id: enc4, component: box, label: H3 Encoder, tone: purple, variant: outlined, props: { width: 72pt } }
  - { id: visual-heading, component: label, label: Visual Stream }
  - { id: action-heading, component: label, label: Action Stream }
  - { id: first-frame, component: image, variant: framed, props: { src: assets/frame-00.jpg, width: 40pt, height: 22.5pt, fit: cover } }
  - { id: first-frame-label, component: label, label: '$I_0$', attach: { to: first-frame, side: west, gap: 0.5mm } }
  - { id: first-encoder, component: box, label: H3 Encoder, tone: purple, variant: outlined }
  - { id: seq-heading, component: label, label: Sequence }
  - { id: refiner, component: box, label: 2-Layer Token Refiner, tone: gray, variant: filled }
  - { id: vae, component: box, label: Visual VAE Encoder, labelRotation: -90, tone: orange, variant: outlined, props: { height: 120pt } }
  - { id: frames-more, component: label, label: "…", attach: { to: frame4, side: east, gap: 0.5mm } }
  - id: seq
    component: tokens
    props:
      gap: 1.5pt
      height: 14pt
      variant: outlined
      cells:
        - { id: static, label: 'Static', tone: gray, width: 36pt }
        - { id: a1, label: '$A_1$', tone: purple, width: 20pt }
        - { id: a2, label: '$A_2$', tone: purple, width: 20pt }
        - { id: a3, label: '$A_3$', tone: purple, width: 20pt }
        - { id: a4, label: '$A_4$', tone: purple, width: 20pt }
        - { id: a5, label: '$A_5$', tone: purple, width: 20pt }
        - { id: adots, label: '$A_{\ldots}$', tone: purple, width: 20pt }
        - { id: i0, label: '$I_0$', tone: gray, width: 20pt }
        - { id: v1, label: '$V_1$', tone: orange, width: 20pt }
        - { id: v2, label: '$V_2$', tone: orange, width: 20pt }
        - { id: v3, label: '$V_3$', tone: orange, width: 20pt }
        - { id: v4, label: '$V_4$', tone: orange, width: 20pt }
        - { id: v5, label: '$V_5$', tone: orange, width: 20pt }
        - { id: vdots, label: '$V_{\ldots}$', tone: orange, width: 20pt }
  - id: bt
    component: tokens
    props:
      gap: 1pt
      height: 14pt
      variant: outlined
      cells:
        - { id: static, label: 'Static', tone: gray, width: 30pt }
        - { id: a1, label: '$A_1$', tone: purple, width: 16pt }
        - { id: a2, label: '$A_2$', tone: purple, width: 16pt }
        - { id: a3, label: '$A_3$', tone: purple, width: 16pt }
        - { id: i0, label: '$I_0$', tone: gray, width: 16pt }
        - { id: v1, label: '$V_1$', tone: orange, width: 16pt }
        - { id: v2, label: '$V_2$', tone: orange, width: 16pt }
        - { id: v3, label: '$V_3$', tone: orange, width: 16pt }
        - { id: pad, label: 'Pad', tone: gray, width: 20pt }
  - { id: b-block1, component: box, label: H3 Omni Transformer Block, tone: blue, variant: filled }
  - { id: b-dots1, component: label, label: "⋮" }
  - { id: b-attn, component: box, label: Single Stream Self-Attention, tone: orange, variant: filled }
  - { id: b-ffn, component: box, label: Feed Forward Network, tone: gray, variant: filled }
  - { id: b-dots2, component: label, label: "⋮" }
  - { id: b-block2, component: box, label: H3 Omni Transformer Block, tone: blue, variant: filled }
  - { id: b-out, component: junction, variant: hidden }
  - { id: ct1, component: box, variant: filled, tone: gray, props: { width: 9pt } }
  - { id: ct2, component: box, variant: filled, tone: purple, props: { width: 9pt } }
  - { id: ct3, component: box, variant: filled, tone: purple, props: { width: 9pt } }
  - { id: ct4, component: box, variant: filled, tone: purple, props: { width: 9pt } }
  - { id: ct5, component: box, variant: filled, tone: gray, props: { width: 9pt } }
  - { id: ct6, component: box, variant: filled, tone: orange, props: { width: 9pt } }
  - { id: ct7, component: box, variant: filled, tone: orange, props: { width: 9pt } }
  - { id: ct8, component: box, variant: filled, tone: orange, props: { width: 9pt } }
  - { id: ct9, component: box, variant: filled, tone: gray, props: { width: 9pt } }
  - { id: lora-in, component: bowtie, label: LoRA, grow: 0.6, props: { gap: 8 }, tone: pink, variant: filled, badge: { icon: emoji/fire, corner: north-east } }
  - { id: qkv, component: box, label: "QKV\nProj.", tone: blue, variant: filled, badge: { icon: emoji/snowflake, corner: north-east } }
  - { id: c-add-in, component: operator, props: { symbol: plus }, tone: orange }
  - { id: lora-out, component: bowtie, label: LoRA, grow: 0.6, props: { gap: 8 }, tone: pink, variant: filled, badge: { icon: emoji/fire, corner: north-east } }
  - { id: out-proj, component: box, label: "Out\nProj.", tone: blue, variant: filled, badge: { icon: emoji/snowflake, corner: north-east } }
  - { id: c-add-out, component: operator, props: { symbol: plus }, tone: orange }
  - id: mask
    component: matrix
    props:
      rows: [ 'S', { label: '$A_1$', tone: purple }, { label: '$A_2$', tone: purple }, { label: '$A_3$', tone: purple }, '$I_0$', { label: '$V_1$', tone: orange }, { label: '$V_2$', tone: orange }, { label: '$V_3$', tone: orange }, 'P' ]
      columns: [ 'S', { label: '$A_1$', tone: purple }, { label: '$A_2$', tone: purple }, { label: '$A_3$', tone: purple }, '$I_0$', { label: '$V_1$', tone: orange }, { label: '$V_2$', tone: orange }, { label: '$V_3$', tone: orange }, 'P' ]
      cellWidth: 12pt
      cellHeight: 9pt
      gap: 1.5pt
      variant: filled
      classes:
        o: { tone: green, label: Allowed }
        L: { tone: orange, label: "A↔V Link" }
        .: { pattern: hatch, label: Masked }
      cells:
        - "o...oooo."
        - "oo..oL..."
        - "o.o.o.L.."
        - "o..oo..L."
        - "o...oooo."
        - "oL..oooo."
        - "o.L.oooo."
        - "o..Loooo."
        - "........o"
  - { id: mask-title, component: label, label: Masked Attention, attach: { to: mask, side: south, gap: 1mm } }
  - { id: key-axis, component: label, label: Key →, attach: { to: mask, side: north, gap: 1mm } }
  - { id: query-axis, component: label, label: Query →, labelRotation: 90 } # reads top to bottom
  - id: mask-key
    component: legend
    props:
      entries:
        - { class: mask.o }
        - { class: mask.L }
        - { class: mask.. }

edges:
  - { from: prompt0, to: enc0 }
  - { from: prompt0, to: prompt1 }
  - { from: prompt1, to: enc1 }
  - { from: prompt1, to: prompt2 }
  - { from: prompt2, to: enc2 }
  - { from: prompt2, to: prompt3 }
  - { from: prompt3, to: enc3 }
  - { from: prompt3, to: prompt4 }
  - { from: prompt4, to: enc4 }
  - { from: first-frame, to: first-encoder }
  - { from: first-encoder, to: refiner, toAnchor: west }
  - { from: enc0, to: refiner, toAnchor: straight }
  - { from: enc1, to: refiner, toAnchor: straight }
  - { from: enc2, to: refiner, toAnchor: straight }
  - { from: enc3, to: refiner, toAnchor: straight }
  - { from: enc4, to: refiner, toAnchor: straight }
  - { from: refiner, fromAnchor: straight, to: seq.a5 }
  - { from: frames-more, to: vae, toAnchor: straight, tone: orange }
  - { from: vae, to: seq.vdots, fromAnchor: south, toAnchor: east, tone: orange }
  - { from: action-heading, to: prompt0, toAnchor: west, label: "scheduled\nprompt", labelAt: middle, variant: muted }
  - { from: bt.a3, to: b-block1, toAnchor: straight }
  - { from: b-block2, to: b-out }
  - { from: b-attn, to: lora, component: zoom }
  - { from: ct5, to: lora-in, fromAnchor: east }
  - { from: ct5, to: qkv, fromAnchor: east }
  - { from: lora-in, to: c-add-in, toAnchor: north, tone: pink }
  - { from: qkv, to: c-add-in, toAnchor: south, tone: blue }
  - { from: c-add-in, to: query-axis } # the arrow stops at the axis title, as in the original
  - { from: mask, to: lora-out }
  - { from: mask, to: out-proj }
  - { from: lora-out, to: c-add-out, toAnchor: north, tone: pink }
  - { from: out-proj, to: c-add-out, toAnchor: south, tone: blue }
