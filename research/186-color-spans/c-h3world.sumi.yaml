  - from: first-frame
    to: first-encoder
  - from: first-encoder
    to: refiner
    toAnchor: west
  - from: enc0
    to: refiner
    toAnchor: straight
  - from: enc1
    to: refiner
    toAnchor: straight
  - from: enc2
    to: refiner
    toAnchor: straight
  - from: enc3
    to: refiner
    toAnchor: straight
  - from: enc4
    to: refiner
    toAnchor: straight
  - from: refiner
    fromAnchor: straight
    to: seq.a5
  - from: frames-more
    to: vae
    toAnchor: straight
    tone: orange
  - from: vae
    to: seq.vdots
    fromAnchor: south
    toAnchor: east
    tone: orange
  - from: action-heading
    to: prompt0
    toAnchor: west
    label: |-
      scheduled
      prompt
    labelAt: middle
    variant: muted
  - from: bt.a3
    to: b-block1
    toAnchor: straight
  - from: b-block2
    to: b-out
  - from: b-attn
    to: lora
    component: zoom
  - from: ct.5
    to: lora-in
    fromAnchor: east
  - from: ct.5
    to: qkv
    fromAnchor: east
  - from: lora-in
    to: c-add-in
    toAnchor: north
    tone: pink
  - from: qkv
    to: c-add-in
    toAnchor: south
    tone: blue
  - from: c-add-in
    to: query-axis
  - from: mask
    to: lora-out
  - from: mask
    to: out-proj
  - from: lora-out
    to: c-add-out
    toAnchor: north
    tone: pink
  - from: out-proj
    to: c-add-out
    toAnchor: south
    tone: blue
