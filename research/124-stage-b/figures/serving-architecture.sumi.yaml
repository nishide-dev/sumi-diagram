# #109 figure 3 (serving architecture) in the syntax proposed for stage B (#124).
# New in this draft (docs/research/124-stage-b.md):
#   groups[].labelAt              §1  titles top-left (no edge enters there), "GPU pool"
#                                     and "Storage" are group titles again instead of
#                                     attached label nodes (#109 round 8)
#   no fromAnchor / toAnchor      §7  the hand-placed anchors of #109 rounds 5 and 8 are
#                                     gone: sides follow the arrange tree and edges from
#                                     different sources into one side are spread in the
#                                     order of their sources (router changes, no syntax)
version: 1
requires: ">=0.5.0"
figure:
  id: serving-architecture
  theme: color
  profile: paper-double
  layout:
    arrange:
      row:
        gap: 5mm
        align: center
        items: [ clients, { stack: { gap: 6mm, align: stretch, items: [ platform, storage ] } } ]
groups:
  - id: clients
    label: Clients
    labelAt: top-left
    arrange:
      stack: { gap: 3mm, align: stretch, items: [ web, mobile, sdk ] }
  - id: platform
    label: ML platform
    labelAt: top-left
    arrange:
      stack: { gap: 6mm, align: center, items: [ { row: { gap: 8mm, align: center, items: [ api, queue ] } }, workers ] }
  - id: api
    label: API tier
    labelAt: top-left
    arrange:
      row:
        gap: 6mm
        align: center
        items:
          - gateway
          - stack: { gap: 4mm, align: stretch, items: [ infer-api, train-api, auth ] }
  - id: workers
    label: Workers
    labelAt: top-left
    arrange:
      row:
        gap: 5mm
        align: end
        items: [ gpu, prep-worker ]
  - id: gpu
    label: GPU pool
    labelAt: bottom
    variant: muted
    arrange:
      row: { gap: 5mm, align: center, items: [ infer-worker, train-worker ] }
  - id: storage
    label: Storage
    labelAt: top-left
    arrange:
      row: { gap: 4mm, align: center, items: [ registry, features, objects, metadata ] }
nodes:
  - { id: web, component: box, label: Web app }
  - { id: mobile, component: box, label: Mobile app }
  - { id: sdk, component: box, label: Python SDK }
  - { id: gateway, component: box, label: "API\ngateway", tone: blue }
  - { id: auth, component: box, label: Auth, tone: blue }
  - { id: infer-api, component: box, label: Inference API, tone: blue }
  - { id: train-api, component: box, label: Training API, tone: blue }
  - { id: queue, component: stack, label: "Job\nqueue" }
  - { id: infer-worker, component: box, label: "Inference\nworkers", tone: purple }
  - { id: train-worker, component: box, label: "Training\nworkers", tone: purple }
  - { id: prep-worker, component: box, label: "Preprocess\nworkers", tone: orange }
  - { id: registry, component: cylinder, label: Model registry }
  - { id: features, component: cylinder, label: Feature store }
  - { id: objects, component: cylinder, label: Object store }
  - { id: metadata, component: cylinder, label: Metadata DB }
edges:
  - { from: web, to: gateway }
  - { from: mobile, to: gateway }
  - { from: sdk, to: gateway }
  - { from: gateway, to: infer-api }
  - { from: gateway, to: train-api }
  - { from: gateway, to: auth }
  - { from: infer-api, to: infer-worker, label: gRPC }
  - { from: train-api, to: queue }
  - { from: queue, to: train-worker }
  - { from: queue, to: prep-worker }
  - { from: infer-worker, to: registry }
  - { from: train-worker, to: registry }
  - { from: infer-worker, to: features }
  - { from: train-worker, to: features }
  - { from: prep-worker, to: features }
  - { from: prep-worker, to: objects }
  - { from: train-api, to: metadata }
  - { from: auth, to: metadata }
