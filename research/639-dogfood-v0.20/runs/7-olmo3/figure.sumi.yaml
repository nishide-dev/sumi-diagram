# Olmo 3 model flow (arXiv 2512.13961, Sections 2.1, 2.2, 3.4-3.6, 4, 5.2.2, 6).
# Started from the pipeline-branch-merge layout (fork into rows) with compare-rows' shared columns.
version: 1
figure:
  id: olmo3-model-flow
  theme: sumi
  profile: paper-double
  layout:
    density: compact
    arrange:
      row:
        gap: 3mm
        items: [base_training, base, split, post_training]
groups:
  - id: base_training
    label: "(a) Base model training · Dolma 3"
    labelAt: above-left
    props: {padding: 2mm}
    arrange:
      row: {gap: 3mm, items: [pretrain, midtrain, longctx]}
  - id: post_training
    label: "(b) Post-training · Dolci"
    labelAt: above-left
    props: {padding: 2mm}
    arrange:
      grid:
        columns: 4
        rowGap: 4mm
        columnGap: 3mm
        align: stretch
        items:
          [think_sft, think_dpo, think_rl, think,
           inst_sft, inst_dpo, inst_rl, instruct,
           ~, ~, zero_rl, rlzero]
nodes:
  - {id: pretrain, component: box, label: Pretraining, sublabel: Dolma 3 Mix, tone: blue, variant: tinted}
  - {id: midtrain, component: box, label: Midtraining, sublabel: Dolmino Mix, tone: blue, variant: tinted}
  - {id: longctx, component: box, label: Long context, sublabel: Longmino Mix, tone: blue, variant: tinted}
  - {id: pretrain_tok, component: label, label: "≤ 5.9T tokens", attach: {to: pretrain, side: south, gap: 1mm}}
  - {id: midtrain_tok, component: label, label: 100B tokens, attach: {to: midtrain, side: south, gap: 1mm}}
  - {id: longctx_tok, component: label, label: "50B (7B)\n100B (32B)", attach: {to: longctx, side: south, gap: 1mm}}
  - {id: base, component: box, label: "Olmo 3\nBase", sublabel: "7B · 32B", variant: emphasis}
  - {id: split, component: junction}
  - {id: think_sft, component: box, label: SFT, tone: green, variant: tinted}
  - {id: think_dpo, component: box, label: DPO, tone: green, variant: tinted}
  - {id: think_rl, component: box, label: RLVR, tone: green, variant: tinted}
  - {id: think, component: box, label: Olmo 3 Think, sublabel: "7B · 32B", variant: emphasis}
  - {id: inst_sft, component: box, label: SFT, tone: green, variant: tinted}
  - {id: inst_dpo, component: box, label: DPO, tone: green, variant: tinted}
  - {id: inst_rl, component: box, label: RLVR, tone: green, variant: tinted}
  - {id: instruct, component: box, label: Olmo 3 Instruct, sublabel: "7B · 32B", variant: emphasis}
  - {id: zero_rl, component: box, label: RLVR, tone: green, variant: tinted}
  - {id: rlzero, component: box, label: Olmo 3 RL-Zero, sublabel: "7B", variant: emphasis}
edges:
  - {from: pretrain, to: midtrain}
  - {from: midtrain, to: longctx}
  - {from: longctx, to: base}
  - {from: base, to: split, component: line}
  - {from: split, to: inst_sft, toAnchor: west}
  - {from: split, to: think_sft, toAnchor: west}
  - {from: split, to: zero_rl, toAnchor: west, label: "math · code · IF · general"}
  - {from: think_sft, to: think_dpo}
  - {from: think_dpo, to: think_rl}
  - {from: think_rl, to: think}
  - {from: inst_sft, to: inst_dpo}
  - {from: inst_dpo, to: inst_rl}
  - {from: inst_rl, to: instruct}
  - {from: zero_rl, to: rlzero}
  - {from: think_sft, to: inst_sft, variant: dashed, label: warm start}
