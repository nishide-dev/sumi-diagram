/* BEGIN SUMI SIZES */
/* sumi catalog --sizes --css --profile paper-double --theme sumi --text-scale 1 */
:root {
  --font: "Sumi Latin", "Sumi", "Inter", "BIZ UDPGothic", sans-serif;  /* font set sumi/inter-biz-ud-gothic */
  --fs-node: 8;          /* pt: node text */
  --fs-group: 9;         /* pt: group title */
  --fs-edge: 7;          /* pt: edge label (profile minimum 7pt) */
  --frame-w: 1;          /* pt: a node's frame */
  --group-frame-w: 0.5;  /* pt: a group's frame */
  --edge-w: 1;           /* pt: an edge */
  --radius: 0pt;         /* a node's corners */
  --gap: 4mm;            /* between the items of a row, stack or grid */
  --group-pad: 2.82mm;   /* a group's padding, each side */
  --node-pad-x: 2.47mm;  /* a box's padding left and right of its label */
  --node-pad-y: 1.23mm;  /* a box's padding above and below its label */
  --box-h: 6mm;          /* a one-line box's height */
  --op: 5.64mm;          /* an operator */
  --op-large: 8.47mm;    /* an operator, size: large */
  --op-xlarge: 11.29mm;  /* an operator, size: xlarge */
  --margin: 1.94mm;      /* around the figure */
  --page-w: 180mm;       /* the profile's page width */
}

/* END SUMI SIZES */
:root { --canvas:#ffffff; --ink:#30364f; --panel:#ffffff; --frame:#a9aebc;
 --blue:#d9e4e6; --blue-line:#3d5d77; --orange:#efdfce; --orange-line:#814b2d;
 --green:#dce7d3; --green-line:#426344; --gray:#e1dece; --gray-line:#4e566b; --arrow:#30364f; --pt:0.3528mm; }
@page { size:180mm 88mm; margin:0 }
html,body { margin:0; background:var(--canvas) }
#fig { position:relative; width:180mm; height:88mm; overflow:hidden; font:calc(var(--fs-node)*var(--pt)) var(--font); color:var(--ink) }
.box,.op,.group,.lbl { position:absolute; box-sizing:border-box; translate:-50% -50% }
.box { display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre; min-height:var(--box-h);
  padding:var(--node-pad-y) var(--node-pad-x); border:calc(var(--frame-w)*var(--pt)) solid var(--ink); background:#fff }
.lbl { white-space:pre; text-align:center }
.small { font-size:calc(var(--fs-edge)*var(--pt)) }
.blue { background:var(--blue); border-color:var(--blue-line) }
.orange { background:var(--orange); border-color:var(--orange-line) }
.green { background:var(--green); border-color:var(--green-line) }
.gray { background:var(--gray); border-color:var(--gray-line) }
.out-orange { border-color:var(--orange-line) }
.group { border:calc(var(--group-frame-w)*var(--pt)) solid var(--frame); background:var(--panel) }
.cap { position:absolute; translate:-50% -50%; font-size:calc(var(--fs-group)*var(--pt)) }
svg.edges { position:absolute; inset:0; width:180mm; height:88mm; overflow:visible }
svg.edges path.e { fill:none; stroke:var(--arrow); stroke-width:0.3528 }
svg.edges path.d { stroke-dasharray:1.2 0.8 }
svg.edges path.z { stroke:#a9aebc; stroke-dasharray:1.2 0.8; fill:none; stroke-width:0.25 }
svg.edges text { font-size:2.47px; fill:var(--ink); font-family:var(--font) }
svg.edges marker path { fill:var(--arrow) }
.wave { border-color:var(--green-line) }
