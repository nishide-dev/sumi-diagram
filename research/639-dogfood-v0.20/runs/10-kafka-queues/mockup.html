/* sumi catalog --sizes --css --profile presentation-16x9 --theme sumi --text-scale 2 */
:root {
  --font: "Sumi Latin", "Sumi", "Inter", "BIZ UDPGothic", sans-serif;  /* font set sumi/inter-biz-ud-gothic */
  --fs-node: 16;         /* pt: node text */
  --fs-group: 18;        /* pt: group title */

  --frame-w: 2;          /* pt: a node's frame */
  --group-frame-w: 1;    /* pt: a group's frame */
  --edge-w: 2;           /* pt: an edge */
  --radius: 0pt;         /* a node's corners */
  --gap: 8mm;            /* between the items of a row, stack or grid */
  --group-pad: 5.64mm;   /* a group's padding, each side */
  --node-pad-x: 4.94mm;  /* a box's padding left and right of its label */
  --node-pad-y: 2.47mm;  /* a box's padding above and below its label */
  --box-h: 11.99mm;      /* a one-line box's height */
  --op: 11.29mm;         /* an operator */
  --op-large: 16.93mm;   /* an operator, size: large */
  --op-xlarge: 22.58mm;  /* an operator, size: xlarge */
  --margin: 4.06mm;      /* around the figure */
  --page-w: 338.7mm;     /* the profile's page width */
}
  :root {
    --canvas: #ffffff; --ink: #30364f; --panel: #ffffff; --frame: #a9aebc;
    --blue: #d9e4e6; --blue-line: #3d5d77; --orange: #efdfce; --orange-line: #814b2d;
    --gray: #e1dece; --gray-line: #4e566b; --plain: #ffffff;
    --arrow: #30364f; --pt: 0.3528mm;
  }
  @page { size: 334mm 176mm; margin: 0 }
  html, body { margin: 0; background: var(--canvas) }
  #fig { position: relative; width: 334mm; height: 176mm; overflow: hidden; font: calc(var(--fs-node) * var(--pt)) var(--font); color: var(--ink) }
  .box, .op, .group, .dot { position: absolute; box-sizing: border-box; translate: -50% -50% }
  .box { display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre;
         min-height: var(--box-h); padding: var(--node-pad-y) var(--node-pad-x);
         border: calc(var(--frame-w) * var(--pt)) solid var(--ink); background: var(--plain) }
  .blue { background: var(--blue); border-color: var(--blue-line); color: var(--blue-line) }
  .orange { background: var(--orange); border-color: var(--orange-line); color: var(--orange-line); border-radius: 50%/18% }
  .grayt { background: var(--gray); border-color: var(--gray-line); color: var(--gray-line) }
  .emph { background: var(--ink); color: #fff; font-weight: bold }
  .group { background: var(--panel); border: calc(var(--group-frame-w) * var(--pt)) solid var(--frame) }
  .group > .title { position: absolute; left: 2mm; top: 1.5mm; font-weight: bold; font-size: calc(var(--fs-group) * var(--pt)) }
  .group > .title.above { top: auto; left: 0; bottom: 100%; margin-bottom: 1mm }
  .dot { width: 5mm; height: 5mm; border-radius: 50%; background: var(--ink) }
  .overflow { outline: 0.6mm dashed red }
  svg.edges { position: absolute; inset: 0; width: 334mm; height: 176mm; overflow: visible }
  svg.edges path.e { fill: none; stroke: var(--arrow); stroke-width: calc(var(--edge-w) * 0.3528) }
  svg.edges text { font-size: calc(var(--fs-edge) * 0.3528px); fill: var(--ink); font-family: var(--font) }
  svg.edges marker path { fill: var(--arrow) }
</style>
