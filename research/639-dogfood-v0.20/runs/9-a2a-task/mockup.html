/* sumi catalog --sizes --css --profile screen-doc --theme sumi --text-scale 1.5 */
:root {
  --font: "Sumi Latin", "Sumi", "Inter", "BIZ UDPGothic", sans-serif;  /* font set sumi/inter-biz-ud-gothic */
  --fs-node: 12;         /* pt: node text */
  --fs-group: 13.5;      /* pt: group title */
  --fs-edge: 10.5;       /* pt: edge label (profile minimum 10pt) */
  --frame-w: 1.5;        /* pt: a node's frame */
  --group-frame-w: 1;    /* pt: a group's frame */
  --edge-w: 1.5;         /* pt: an edge */
  --radius: 0pt;         /* a node's corners */
  --gap: 6mm;            /* between the items of a row, stack or grid */
  --group-pad: 4.23mm;   /* a group's padding, each side */
  --node-pad-x: 3.7mm;   /* a box's padding left and right of its label */
  --node-pad-y: 1.76mm;  /* a box's padding above and below its label */
  --box-h: 8.82mm;       /* a one-line box's height */
  --op: 8.47mm;          /* an operator */
  --op-large: 12.7mm;    /* an operator, size: large */
  --op-xlarge: 16.93mm;  /* an operator, size: xlarge */
  --margin: 3mm;         /* around the figure */
  --page-w: 200mm;       /* the profile's page width */
}
:root { --canvas:#ffffff; --ink:#30364f; --panel:#ffffff; --frame:#a9aebc;
 --blue:#d9e4e6; --blue-line:#3d5d77; --orange:#efdfce; --orange-line:#814b2d; --gray:#e1dece; --gray-line:#4e566b;
 --arrow:#30364f; --pt:0.3528mm; }
@page { size:200mm 124mm; margin:0 }
html,body { margin:0; background:var(--canvas) }
#fig { position:relative; width:200mm; height:124mm; overflow:hidden; font:calc(var(--fs-node)*var(--pt)) var(--font); color:var(--ink) }
.box,.dot,.group { position:absolute; box-sizing:border-box; translate:-50% -50% }
.box { display:flex; align-items:center; justify-content:center; text-align:center; white-space:pre; min-height:var(--box-h);
 padding:var(--node-pad-y) var(--node-pad-x); border:calc(var(--frame-w)*var(--pt)) solid var(--ink); background:#fff }
.blue { background:var(--blue); border-color:var(--blue-line) }
.orange { background:var(--orange); border-color:var(--orange-line); color:var(--orange-line) }
.gray { background:var(--gray); border-color:var(--gray-line) }
.dashed { border-style:dashed }
.dot { width:5.3mm; height:5.3mm; border-radius:50%; background:var(--ink) }
.group { border:calc(var(--group-frame-w)*var(--pt)) solid var(--frame); background:var(--panel) }
.group .title { position:absolute; left:2mm; top:1.2mm; font-weight:bold; font-size:calc(var(--fs-group)*var(--pt)) }
svg.edges { position:absolute; inset:0; width:200mm; height:124mm }
svg.edges path.e { fill:none; stroke:var(--arrow); stroke-width:calc(var(--edge-w)*0.3528) }
svg.edges text { font-size:calc(var(--fs-edge)*0.3528px); fill:var(--ink); font-family:var(--font) }
svg.edges marker path { fill:var(--arrow) }
</style>
