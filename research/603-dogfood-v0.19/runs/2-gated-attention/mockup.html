<!doctype html>
<meta charset="utf-8">
<title>mockup</title>
<style>
  :root {
    --canvas: #ffffff; --ink: #30364f;
    --blue: #d9e4e6; --blue-line: #3d5d77;
    --orange: #efdfce; --orange-line: #814b2d;
    --muted: #4e566b;
    --font: Inter, "Helvetica Neue", Arial, sans-serif;
    --fs-node: 8; --fs-group: 9; --fs-edge: 7;
    --frame-w: 0.75; --edge-w: 0.75;
    --arrow: #30364f; --pt: 0.3528mm;
  }
  @page { size: 88mm 78mm; margin: 0 }
  html, body { margin: 0; background: var(--canvas) }
  #fig { position: relative; width: 88mm; height: 78mm; overflow: hidden; font: calc(var(--fs-node) * var(--pt)) var(--font); color: var(--ink) }
  .box { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
         text-align: center; border: calc(var(--frame-w) * var(--pt)) solid var(--ink); background: #fff; border-radius: 0.8mm; transform: translate(-50%,-50%) }
  .blue { background: var(--blue); border-color: var(--blue-line) }
  .orange { background: var(--orange); border-color: var(--orange-line) }
  .op { position:absolute; border-radius: 50%; box-sizing:border-box; border: calc(var(--frame-w) * var(--pt)) solid var(--ink); background:#fff; transform: translate(-50%,-50%); display:flex; align-items:center; justify-content:center; width:4mm; height:4mm; font-size: 7pt }
  .op.big { width:5.5mm; height:5.5mm; background: var(--orange); border-color: var(--orange-line); color: var(--orange-line) }
  .t { position:absolute; transform: translate(-50%,-50%); white-space: nowrap }
  .tl { position:absolute; transform: translate(0,-50%); white-space: nowrap }
  .small { font-size: calc(var(--fs-edge) * var(--pt)) }
  .cap { font-size: calc(var(--fs-group) * var(--pt)) }
  .cell { position:absolute; box-sizing:border-box; transform: translate(-50%,-50%); border: calc(0.75 * var(--pt)) solid var(--muted); display:flex; align-items:center; justify-content:center; font-size: 7pt }
  svg.edges { position: absolute; inset: 0; width: 88mm; height: 78mm; overflow: visible }
  svg.edges path.e { fill: none; stroke: var(--arrow); stroke-width: calc(var(--edge-w) * 0.3528) }
  svg.edges marker path { fill: var(--arrow) }
</style>
<div id="fig">
  <!-- (a) gate positions, bottom-up -->
  <div class="t" style="left:22mm; top:3mm">Output</div>
  <div class="op" style="left:22mm; top:10mm">×</div><div class="tl small" style="left:25mm; top:10mm">G5</div>
  <div class="box" style="left:22mm; top:18mm; width:30mm; height:6mm"><span>Output proj. W<sub>O</sub></span></div>

  <div class="box" style="left:33mm; top:55mm; width:9mm; height:5.5mm"><span>W<sub>V</sub></span></div>

  <div class="tl small" style="left:46mm; top:27mm; color:#814b2d">G1 SDPA</div>
  <div class="cell" style="left:71mm; top:27mm; width:9.5mm; height:5mm; background:var(--orange); border-color:var(--orange-line)">5.761</div>

  <div class="tl small" style="left:46mm; top:49mm">G5 output</div><div class="cell" style="left:71mm; top:49mm; width:9.5mm; height:5mm">6.017</div><div class="cell" style="left:81mm; top:49mm; width:9.5mm; height:5mm">59.41</div>
  <div class="tl small" style="left:46mm; top:54.5mm">No gate</div><div class="cell" style="left:71mm; top:54.5mm; width:9.5mm; height:5mm">6.026</div><div class="cell" style="left:81mm; top:54.5mm; width:9.5mm; height:5mm">58.79</div>

  </svg>
</div>
