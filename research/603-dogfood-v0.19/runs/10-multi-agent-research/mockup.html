<!doctype html>
<!-- Mockup for run 10 (orchestrator-worker research system), theme sumi, presentation-16x9, textScale 2. -->
<meta charset="utf-8">
<title>mockup</title>
<style>
  :root {
    --canvas: #ffffff; --ink: #30364f; --panel: #efeddd;
    --blue: #d9e4e6; --blue-line: #3d5d77;
    --orange: #efdfce; --orange-line: #814b2d;
    --muted-line: #4e566b;
    --font: "Inter", "Helvetica Neue", Arial, sans-serif;
    --fs-node: 16; --fs-group: 18; --fs-edge: 14;
    --frame-w: 1; --edge-w: 1;
    --arrow: #30364f;
    --pt: 0.3528mm;
  }
  @page { size: 300mm 135mm; margin: 0 }
  html, body { margin: 0; background: var(--canvas) }
  #fig { position: relative; width: 300mm; height: 135mm; overflow: hidden; font: calc(var(--fs-node) * var(--pt)) var(--font); color: var(--ink) }
  .box { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
         text-align: center; border: calc(var(--frame-w) * var(--pt)) solid var(--ink); background: #fff; border-radius: 0.8mm; line-height: 1.15 }
  .tinted-blue { background: var(--blue); border-color: var(--blue-line); color: var(--blue-line) }
  .tinted-orange { background: var(--orange); border-color: var(--orange-line); color: var(--orange-line) }
  .cyl { border-radius: 50% / 18% }
  .group { position: absolute; box-sizing: border-box; background: var(--panel); border: calc(var(--frame-w) * var(--pt)) solid var(--muted-line) }
  .group > .title { position: absolute; left: 0; bottom: 100%; font-weight: bold; font-size: calc(var(--fs-group) * var(--pt)); white-space: nowrap; padding-bottom: 1mm }
  .group > .caption { position: absolute; left: 0; right: 0; top: 100%; text-align: center; font-size: calc(var(--fs-node) * var(--pt)); padding-top: 1.5mm; white-space: nowrap }
  .lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap }
  svg.edges { position: absolute; inset: 0; width: 300mm; height: 135mm; overflow: visible }
  svg.edges path.e { fill: none; stroke: var(--arrow); stroke-width: calc(var(--edge-w) * 0.3528) }
  svg.edges text { font-family: var(--font); font-size: calc(var(--fs-edge) * 0.3528px); fill: var(--ink) }
  svg.edges marker path { fill: var(--arrow) }
  svg.edges .diamond { fill: #fff; stroke: var(--ink); stroke-width: 0.3528 }
</style>
<div id="fig">
  <!-- user: icon + label -->
  <div class="lbl" style="left:16mm; top:36mm; font-size:14mm">&#128100;</div>
  <div class="lbl" style="left:16mm; top:24mm">User</div>

  <div class="group" style="left:44mm; top:20mm; width:246mm; height:34mm"><div class="title">Lead researcher</div></div>
  <div class="box" style="left:52mm; top:29mm; width:32mm; height:16mm">Plan</div>
  <div class="box" style="left:104mm; top:28mm; width:44mm; height:18mm">Spawn<br>subagents</div>
  <div class="box" style="left:168mm; top:28mm; width:44mm; height:18mm">Synthesize<br>results</div>
  <!-- diamond drawn in svg at centre (258,37) -->

  <div class="box tinted-blue cyl" style="left:52mm; top:76mm; width:32mm; height:20mm">Memory</div>

  <div class="group" style="left:98mm; top:74mm; width:120mm; height:24mm"><div class="caption">Subagents, 3–5 in parallel:<br>web search + interleaved thinking</div></div>
  <div class="box tinted-orange" style="left:103mm; top:78mm; width:34mm; height:16mm">Subagent 1</div>
  <div class="box tinted-orange" style="left:141mm; top:78mm; width:34mm; height:16mm">Subagent 2</div>
  <div class="box tinted-orange" style="left:179mm; top:78mm; width:34mm; height:16mm">Subagent 3</div>

  <div class="box tinted-orange" style="left:236mm; top:77mm; width:44mm; height:18mm">Citation<br>agent</div>

  <svg class="edges" viewBox="0 0 300 135">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9z"/></marker></defs>
    <polygon class="diamond" points="258,23 282,37 258,51 234,37"/>
    <text x="258" y="35.5" text-anchor="middle" style="font-size:5.64px">More</text>
    <text x="258" y="41.5" text-anchor="middle" style="font-size:5.64px">research?</text>
    <!-- query -->
    <path class="e" d="M24 37 H52" marker-end="url(#ah)"/><text x="33" y="34" text-anchor="middle">query</text>
    <path class="e" d="M84 37 H104" marker-end="url(#ah)"/>
    <path class="e" d="M148 37 H168" marker-end="url(#ah)"/>
    <path class="e" d="M212 37 H234" marker-end="url(#ah)"/>
    <!-- yes loop over the top -->
    <path class="e" d="M258 23 V12 H126 V28" marker-end="url(#ah)"/><text x="192" y="10" text-anchor="middle">yes</text>
    <!-- plan -> memory -->
    <path class="e" d="M68 45 V76" marker-end="url(#ah)"/><text x="70" y="62">save plan</text>
    <!-- spawn -> subagents, subagents -> synthesize -->
    <path class="e" d="M126 46 V74" marker-end="url(#ah)"/><text x="128" y="62">tasks</text>
    <path class="e" d="M190 74 V46" marker-end="url(#ah)"/><text x="192" y="62">findings</text>
    <!-- no -> citation -->
    <path class="e" d="M258 51 V77" marker-end="url(#ah)"/><text x="260" y="66">no</text>
    <!-- citation -> user -->
    <path class="e" d="M258 95 V118 H16 V44" marker-end="url(#ah)"/><text x="140" y="116" text-anchor="middle">report with citations</text>
  </svg>
</div>
