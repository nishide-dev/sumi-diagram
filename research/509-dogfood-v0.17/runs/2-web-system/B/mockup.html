<!doctype html>
<html><head><meta charset="utf-8"><title>Web system mockup</title>
<style>
@font-face { font-family: InterM; src: url(/Users/ryusei0623/projects/sumi-diagram/assets/fonts/inter/Inter-Regular.ttf); }
@font-face { font-family: InterM; font-weight: bold; src: url(/Users/ryusei0623/projects/sumi-diagram/assets/fonts/inter/Inter-Bold.ttf); }
:root { --canvas:#f8f8ee; --ink:#30364f; --muted:#4e566b; --panel:#efeddd; --shade:#e1d9bc;
  --blue:#d9e4e6; --blueL:#3d5d77; --green:#dce7d3; --greenL:#426344; --orange:#efdfce; --orangeL:#814b2d; }
html,body { margin:0; background:var(--canvas); }
.page { position:relative; width:180mm; height:101.25mm; font-family:InterM, sans-serif; color:var(--ink); }
.n { position:absolute; box-sizing:border-box; display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:8pt; line-height:1.2; border:1pt solid var(--ink); background:var(--canvas); }
.g { position:absolute; box-sizing:border-box; border:1pt solid var(--muted); background:var(--panel); }
.g .t { position:absolute; top:1.6mm; left:0; right:0; text-align:center; font-size:9pt; font-weight:bold; }
.g.ext { background:transparent; border-style:dashed; }
.g.ext .t { color:var(--muted); }
.blue { background:var(--blue); border-color:var(--blueL); }
.green { background:var(--green); border-color:var(--greenL); }
.orange { background:var(--orange); border-color:var(--orangeL); }
.emph { background:var(--ink); color:var(--canvas); font-weight:bold; border-color:var(--ink); }
svg { position:absolute; left:0; top:0; overflow:visible; }
.el { font-size:7pt; fill:var(--ink); font-family:InterM; }
.lg { position:absolute; font-size:7pt; display:flex; align-items:center; gap:1.5mm; }
</style></head>
