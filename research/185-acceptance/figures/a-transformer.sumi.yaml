# #185 acceptance: figure A of #167, the Transformer (Vaswani et al. 2017,
# arXiv 1706.03762v7, Fig. 1; only generic block names are reused), redrawn
# with the v0.6.0 syntax. Same as research/182-compact/figures/
# a-transformer.sumi.yaml: theme paper (#173: rounded boxes, black frames,
# light gray groups, small arrowheads, Inter) and density: compact (#182, no
# gaps of its own except 2mm between the columns, the 0 gaps and attach
# gaps). The figure needs none of the other stage-C fields. K and V enter
# the decoder's attention left of the centre ("south:0.2" / "south:0.4"), Q
# right of it ("south:0.8"), as the Skill teaches (structured.md, anchors).
version: 1
requires: ">=0.6.0"
figure:
  id: stage-c-transformer
  theme: paper
  profile: paper-single
  layout:
    density: compact
    arrange:
      row:
        gap: 2mm
        align: end
        items:
          - stack: { direction: up, items: [ inputs, input-embedding, enc-add, encoder ] }
          - stack:
              direction: up
              items: [ outputs, output-embedding, dec-add, decoder, linear, softmax, probabilities ]

groups:
  - id: encoder
    arrange:
      stack:
        direction: up
        align: stretch
        items:
          - enc-split1
          - stack: { direction: up, gap: 0, items: [ enc-mha, enc-norm1 ] }
          - enc-split2
          - stack: { direction: up, gap: 0, items: [ enc-ff, enc-norm2 ] }
  - id: decoder
    arrange:
      stack:
        direction: up
        align: stretch
        items:
          - dec-split1
          - stack: { direction: up, gap: 0, items: [ dec-mmha, dec-norm1 ] }
          - dec-split2
          - stack: { direction: up, gap: 0, items: [ dec-mha, dec-norm2 ] }
          - dec-split3
          - stack: { direction: up, gap: 0, items: [ dec-ff, dec-norm3 ] }

nodes:
  - { id: inputs, component: label, label: Inputs }
  - { id: input-embedding, component: box, label: "Input\nEmbedding", tone: pink }
  - { id: enc-add, component: operator, props: { symbol: plus } }
  - { id: enc-pe, component: circle, icon: tabler/wave-sine, attach: { to: enc-add, side: west, gap: 1mm } }
  - { id: enc-pe-label, component: label, label: "Positional\nEncoding", attach: { to: enc-pe, side: west, gap: 0.5mm } }
  - { id: enc-split1, component: junction, variant: hidden }
  - { id: enc-mha, component: box, label: "Multi-Head\nAttention", tone: orange }
  - { id: enc-norm1, component: box, label: "Add & Norm", tone: yellow }
  - { id: enc-split2, component: junction, variant: hidden }
  - { id: enc-ff, component: box, label: "Feed\nForward", tone: blue }
  - { id: enc-norm2, component: box, label: "Add & Norm", tone: yellow }
  - { id: enc-n, component: label, label: "N×", attach: { to: encoder, side: west, gap: 2mm } }
  - { id: outputs, component: label, label: "Outputs\n(shifted right)" }
  - { id: output-embedding, component: box, label: "Output\nEmbedding", tone: pink }
  - { id: dec-add, component: operator, props: { symbol: plus } }
  - { id: dec-pe, component: circle, icon: tabler/wave-sine, attach: { to: dec-add, side: east, gap: 1mm } }
  - { id: dec-pe-label, component: label, label: "Positional\nEncoding", attach: { to: dec-pe, side: east, gap: 0.5mm } }
  - { id: dec-split1, component: junction, variant: hidden }
  - { id: dec-mmha, component: box, label: "Masked\nMulti-Head\nAttention", tone: orange }
  - { id: dec-norm1, component: box, label: "Add & Norm", tone: yellow }
  - { id: dec-split2, component: junction, variant: hidden }
  - { id: dec-mha, component: box, label: "Multi-Head\nAttention", tone: orange }
  - { id: dec-norm2, component: box, label: "Add & Norm", tone: yellow }
  - { id: dec-split3, component: junction, variant: hidden }
  - { id: dec-ff, component: box, label: "Feed\nForward", tone: blue }
  - { id: dec-norm3, component: box, label: "Add & Norm", tone: yellow }
  - { id: dec-n, component: label, label: "N×", attach: { to: decoder, side: east, gap: 2mm } }
  - { id: linear, component: box, label: Linear, tone: purple }
  - { id: softmax, component: box, label: Softmax, tone: green }
  - { id: probabilities, component: label, label: "Output\nProbabilities" }

edges:
  - { from: inputs, to: input-embedding }
  - { from: input-embedding, to: enc-add }
  - { from: enc-pe, to: enc-add, component: line }
  - { from: enc-add, to: enc-split1, component: line }
  - { from: enc-split1, to: enc-mha, toAnchor: "south:0.2" }
  - { from: enc-split1, to: enc-mha, toAnchor: "south:0.5" }
  - { from: enc-split1, to: enc-mha, toAnchor: "south:0.8" }
  - { from: enc-split1, to: enc-norm1, toAnchor: west }
  - { from: enc-norm1, to: enc-split2, component: line }
  - { from: enc-split2, to: enc-ff }
  - { from: enc-split2, to: enc-norm2, toAnchor: west }
  - { from: outputs, to: output-embedding }
  - { from: output-embedding, to: dec-add }
  - { from: dec-pe, to: dec-add, component: line }
  - { from: dec-add, to: dec-split1, component: line }
  - { from: dec-split1, to: dec-mmha, toAnchor: "south:0.2" }
  - { from: dec-split1, to: dec-mmha, toAnchor: "south:0.5" }
  - { from: dec-split1, to: dec-mmha, toAnchor: "south:0.8" }
  - { from: dec-split1, to: dec-norm1, toAnchor: east }
  - { from: dec-norm1, to: dec-split2, component: line }
  # K and V from the encoder enter left of the centre line, Q right of it:
  # the encoder trunk then never crosses the decoder's own line (no hop).
  - { from: enc-norm2, fromAnchor: north, to: dec-mha, toAnchor: "south:0.2" }
  - { from: enc-norm2, fromAnchor: north, to: dec-mha, toAnchor: "south:0.4" }
  - { from: dec-split2, to: dec-mha, toAnchor: "south:0.8" }
  - { from: dec-split2, to: dec-norm2, toAnchor: east }
  - { from: dec-norm2, to: dec-split3, component: line }
  - { from: dec-split3, to: dec-ff }
  - { from: dec-split3, to: dec-norm3, toAnchor: east }
  - { from: dec-norm3, to: linear }
  - { from: linear, to: softmax }
  - { from: softmax, to: probabilities }
