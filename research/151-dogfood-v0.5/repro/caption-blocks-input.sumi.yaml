# A3: a group entered from below with a `caption`: the caption sits between
# x and the group, so x → f detours around it (out to the left and back),
# with no diagnostic.
version: 1
requires: ">=0.5.1"
figure:
  id: caption-blocks-input
  theme: academic
  profile: paper-single
  layout:
    arrange:
      stack: { direction: up, gap: 3mm, items: [ x, block, y ] }
groups:
  - id: block
    caption: (a) one block
    arrange:
      stack: { direction: up, gap: 3mm, items: [ f, g ] }
nodes:
  - { id: x, component: label, label: $x$ }
  - { id: f, component: box, label: Layer Norm }
  - { id: g, component: box, label: Attention }
  - { id: y, component: label, label: $y$ }
edges:
  - { from: x, to: f }
  - { from: f, to: g }
  - { from: g, to: y }
