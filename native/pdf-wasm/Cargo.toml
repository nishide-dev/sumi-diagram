# Sumi's SVG → PDF engine (#74): krilla compiled to wasm32-unknown-unknown and
# run from Bun (src/render/pdf). Build with `bun run pdf:wasm`; the result is
# committed as assets/wasm/sumi-pdf.wasm and pinned by sha256 in
# src/render/pdf/engine.ts. CI rebuilds it from this directory and fails if the
# bytes differ (reproducible build).
[package]
name = "sumi-pdf"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "SVG -> vector PDF for Sumi; fonts only from the given files (no system fonts)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# krilla-svg enables raster/filter support transitively. Sumi's finalized
# diagrams remain vectors; only explicitly supplied fonts are loaded.
krilla = { version = "=0.8.2", default-features = false }
krilla-svg = { version = "=0.8.1" }
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
fontdb = { version = "=0.23.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
